<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Records and rankings","url":"https://australianculture.biblioverse.org/records.html","numberOfItems":18,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Highway 1","description":"(Geography · 14,500 km) The longest national highway in the world, looping right around the country.","sameAs":"https://en.wikipedia.org/wiki/Highway_1_(Australia)"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Nullarbor Links","description":"(Geography · 1,365 km) The longest golf course in the world: 18 holes spread along the Eyre Highway between SA and WA.","sameAs":"https://en.wikipedia.org/wiki/Nullarbor_Links"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Dingo Fence","description":"(Geography · 5,614 km) The longest fence in the world, built to keep dingoes away from sheep in the south-east.","sameAs":"https://en.wikipedia.org/wiki/Dingo_Fence"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"90 Mile Straight","description":"(Geography · 146.6 km) The longest straight stretch of sealed road in the country, on the Eyre Highway.","sameAs":"https://en.wikipedia.org/wiki/Eyre_Highway"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Straight railway","description":"(Geography · 478 km) The longest stretch of dead-straight railway in the world, across the Nullarbor Plain.","sameAs":"https://en.wikipedia.org/wiki/Trans-Australian_Railway"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Great Barrier Reef","description":"(Nature · 2,300 km) The biggest reef system on the planet, visible from space.","sameAs":"https://en.wikipedia.org/wiki/Great_Barrier_Reef"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"K’gari (Fraser Island)","description":"(Nature · 1,840 km²) The biggest sand island in the world, with freshwater lakes and rainforest.","sameAs":"https://en.wikipedia.org/wiki/K%27gari"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Great Artesian Basin","description":"(Nature · 1.7m km²) One of the largest underground water reserves in the world, beneath 22% of the country.","sameAs":"https://en.wikipedia.org/wiki/Great_Artesian_Basin"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Oldest living culture","description":"(Society · 60,000+ years) Aboriginal and Torres Strait Islander peoples have the oldest continuous culture on Earth.","sameAs":"https://en.wikipedia.org/wiki/Aboriginal_Australians"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Biggest country","description":"(Rankings · 6th) 7.69 million km², and the only country that covers a whole continent.","sameAs":"https://en.wikipedia.org/wiki/List_of_countries_and_dependencies_by_area"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Minimum wage","description":"(Rankings · A$26.44/hr) The national minimum wage since July 2026 (A$1,004.90 a week), one of the highest in the world.","sameAs":"https://en.wikipedia.org/wiki/Minimum_wage_in_Australia"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Nobel Prizes","description":"(Rankings · 15) Eight in Medicine, including Howard Florey (penicillin) and Peter Doherty (the immune system). Patrick White won for Literature in 1973.","sameAs":"https://en.wikipedia.org/wiki/List_of_Australian_Nobel_laureates"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Voter turnout","description":"(Society · ~90%) Voting has been compulsory since 1924 and you get fined if you don’t. The result is one of the highest turnouts in the world.","sameAs":"https://en.wikipedia.org/wiki/Electoral_system_of_Australia"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Women’s vote","description":"(Society · 1902) One of the first countries to give women the right to vote and stand in national elections.","sameAs":"https://en.wikipedia.org/wiki/Women%27s_suffrage_in_Australia"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"The MCG","description":"(Society · 100,024) The Melbourne Cricket Ground is the biggest stadium in the southern hemisphere and the biggest cricket ground in the world.","sameAs":"https://en.wikipedia.org/wiki/Melbourne_Cricket_Ground"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Gambling losses","description":"(Rankings · 1st) Australians lose more money gambling per person than anyone in the world, driven by the “pokies”.","sameAs":"https://en.wikipedia.org/wiki/Gambling_in_Australia"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Most venomous snake","description":"(Nature · 1st) The inland taipan has the most potent venom of any land snake. It’s shy and lives far from everything.","sameAs":"https://en.wikipedia.org/wiki/Inland_taipan"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Mount Augustus","description":"(Nature · 858 m) Often called the biggest monolith in the world, twice the size of Uluru.","sameAs":"https://en.wikipedia.org/wiki/Mount_Augustus_National_Park"}}]}]}</script>
