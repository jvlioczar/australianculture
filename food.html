<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"On the plate every day","url":"https://australianculture.biblioverse.org/food.html","numberOfItems":6,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Fruit and veg","description":"Mangoes, avocados, bananas and macadamias, many of them grown right here."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Bread and toast","description":"Toast for brekkie, with Vegemite or butter."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Asian food","description":"Thai, Chinese, Vietnamese and Indian are the everyday takeaway."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Café coffee","description":"Flat whites and long blacks, never filter coffee."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Fish and chips","description":"Battered fish and chips, ideally eaten at the beach."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Italian and Greek","description":"A legacy of post-war migration, especially in Melbourne."}}]},{"@type":"ItemList","name":"Icons, dishes, sweets and drinks","url":"https://australianculture.biblioverse.org/food.html","numberOfItems":28,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Vegemite","description":"(Icons · 1923) Dark, salty yeast-extract spread created by Cyril Callister in Melbourne. Goes on buttered toast in a thin layer (very thin!). Packed with B vitamins.","sameAs":"https://en.wikipedia.org/wiki/Vegemite"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Tim Tam","description":"(Icons · 1964) Arnott’s chocolate biscuit. The ritual is the “Tim Tam Slam”: bite off the ends and use it as a straw for coffee or hot chocolate.","sameAs":"https://en.wikipedia.org/wiki/Tim_Tam"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Anzac biscuits","description":"(Icons · 1915) Oat, coconut and golden syrup biscuits linked to the soldiers of World War I. The name “Anzac” is protected by law, and they must never be called “cookies”.","sameAs":"https://en.wikipedia.org/wiki/Anzac_biscuit"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Pie","description":"(Icons · 1800s) The single-serve savoury pie with tomato sauce, the official snack of the footy. These days nearly every bakery does vegetarian and vegan versions.","sameAs":"https://en.wikipedia.org/wiki/Meat_pie_(Australia_and_New_Zealand)"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Pavlova","description":"(Icons · 1920s) Meringue that’s crisp outside and soft inside, topped with cream and fruit. Named after the ballerina Anna Pavlova. New Zealand claims it too.","sameAs":"https://en.wikipedia.org/wiki/Pavlova"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Lamington","description":"(Icons · 1900) A square of sponge cake dipped in chocolate and rolled in coconut. There’s even a National Lamington Day (21 July).","sameAs":"https://en.wikipedia.org/wiki/Lamington"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Fairy bread","description":"(Icons · 1920s) White bread with butter and hundreds and thousands, cut into triangles. Compulsory at every kids’ party.","sameAs":"https://en.wikipedia.org/wiki/Fairy_bread"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Sausage sizzle","description":"(Dishes and traditions) A snag in a slice of bread (these days almost always with a veggie option), sold to raise funds at fetes, schools and on election day: the famous “democracy sausage”.","sameAs":"https://en.wikipedia.org/wiki/Sausage_sizzle"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"The barbie","description":"(Dishes and traditions) Free public electric barbecues in practically every park. Getting together around the barbie is the most Australian social occasion there is.","sameAs":"https://en.wikipedia.org/wiki/Barbecue"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Smashed avo","description":"(Dishes and traditions) Toast with smashed avocado, the symbol of Aussie brunch. A columnist famously blamed it for young people not being able to buy a house (2016).","sameAs":"https://en.wikipedia.org/wiki/Avocado_toast"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Bowen mango","description":"(Dishes and traditions · summer) The Queensland mango is the fruit of an Aussie Christmas: the trays hit the shops in December and everyone buys them.","sameAs":"https://en.wikipedia.org/wiki/Kensington_Pride"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Damper","description":"(Dishes and traditions) Simple bread of flour and water baked in the coals, the food of outback travellers.","sameAs":"https://en.wikipedia.org/wiki/Damper_(food)"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Christmas in summer","description":"(Dishes and traditions) Because Christmas falls in summer, lunch is light and cold, with salads, fruit, pavlova and ice cream, ideally at the beach or in the park.","sameAs":"https://en.wikipedia.org/wiki/Christmas_in_Australia"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Golden Gaytime","description":"(Sweets and snacks · 1959) Toffee and vanilla ice cream coated in biscuit crumbs. The classic slogan: “It’s hard to have a Gaytime on your own”.","sameAs":"https://en.wikipedia.org/wiki/Golden_Gaytime"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Caramello Koala","description":"(Sweets and snacks) Cadbury’s koala-shaped chocolate with a caramel centre.","sameAs":"https://en.wikipedia.org/wiki/Caramello_Koala"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Freddo Frog","description":"(Sweets and snacks · 1930) The chocolate frog of every Aussie childhood. Its price (once 20 cents) is a running joke about inflation.","sameAs":"https://en.wikipedia.org/wiki/Freddo"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Iced VoVo","description":"(Sweets and snacks) A biscuit topped with pink fondant, raspberry jam and coconut.","sameAs":"https://en.wikipedia.org/wiki/Iced_VoVo"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Shapes","description":"(Sweets and snacks · 1976) Arnott’s savoury biscuits in flavours like Pizza and Barbecue. The 2015 recipe change caused a national uproar.","sameAs":"https://en.wikipedia.org/wiki/Arnott%27s_Shapes"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Twisties","description":"(Sweets and snacks) Cheesy corn snack, a cousin of Cheetos.","sameAs":"https://en.wikipedia.org/wiki/Twisties"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Cherry Ripe","description":"(Sweets and snacks · 1924) The country’s oldest chocolate bar: cherry and coconut covered in dark chocolate.","sameAs":"https://en.wikipedia.org/wiki/Cherry_Ripe_(chocolate_bar)"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Weet-Bix","description":"(Sweets and snacks) Whole-wheat breakfast biscuits. “Aussie kids are Weet-Bix kids.”","sameAs":"https://en.wikipedia.org/wiki/Weet-Bix"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Milo","description":"(Drinks · 1934) Chocolate malt powder created in Sydney by Thomas Mayne. The best bit is the crunchy powder floating on cold milk.","sameAs":"https://en.wikipedia.org/wiki/Milo_(drink)"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Flat white","description":"(Drinks · 1980s) Espresso with steamed milk and a thin layer of foam. Australia and New Zealand both claim it. Melbourne is the coffee capital.","sameAs":"https://en.wikipedia.org/wiki/Flat_white"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Lemon, lime & bitters","description":"(Drinks) Lemonade with lime cordial and a few dashes of Angostura. The pub drink for when you’re not drinking.","sameAs":"https://en.wikipedia.org/wiki/Lemon,_lime_and_bitters"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Bundy & Coke","description":"(Drinks) Bundaberg rum and Coke, with the polar bear on the bottle.","sameAs":"https://en.wikipedia.org/wiki/Bundaberg_Rum"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Macadamia","description":"(Bush tucker (native)) Native to Queensland and NSW, it’s the only Australian native nut grown commercially around the world.","sameAs":"https://en.wikipedia.org/wiki/Macadamia"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Wattleseed","description":"(Bush tucker (native)) Roasted acacia seed with a coffee and chocolate flavour, used by Aboriginal people for thousands of years.","sameAs":"https://en.wikipedia.org/wiki/Wattleseed"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Finger lime","description":"(Bush tucker (native)) The “citrus caviar”: a finger-shaped lime full of tangy little pearls. A chef’s favourite.","sameAs":"https://en.wikipedia.org/wiki/Citrus_australasica"}}]}]}</script>
