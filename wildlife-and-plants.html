<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Wildlife and plants","url":"https://australianculture.biblioverse.org/wildlife-and-plants.html","numberOfItems":69,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Eastern grey kangaroo","description":"(Mammals) The kangaroo you’ll see most in the east, in parks, on golf courses and by the roadside at dusk. Lives in groups called “mobs”.","sameAs":"https://en.wikipedia.org/wiki/Eastern_grey_kangaroo"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Red kangaroo","description":"(Mammals) The biggest marsupial in the world: a male can stand over 1.8 m. Lives in the arid interior and bounds along at more than 50 km/h.","sameAs":"https://en.wikipedia.org/wiki/Red_kangaroo"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Wallaby","description":"(Mammals) Looks like a mini kangaroo. There are dozens of species, like the red-necked wallaby, common in Tasmania and the east.","sameAs":"https://en.wikipedia.org/wiki/Wallaby"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Koala","description":"(Mammals) Not a bear: a marsupial that eats almost nothing but gum leaves and sleeps up to 20 hours a day. Endangered across much of the east.","sameAs":"https://en.wikipedia.org/wiki/Koala"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Wombat","description":"(Mammals) A sturdy marsupial that digs enormous burrows. The only animal known to make cube-shaped poo.","sameAs":"https://en.wikipedia.org/wiki/Wombat"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Platypus","description":"(Mammals) An egg-laying mammal with a duck’s bill, and the males have a venomous spur. Lives in eastern rivers and is hard to spot.","sameAs":"https://en.wikipedia.org/wiki/Platypus"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Echidna","description":"(Mammals) The other egg-laying mammal. Covered in spines, it eats ants and termites with a long tongue.","sameAs":"https://en.wikipedia.org/wiki/Echidna"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Quokka","description":"(Mammals) The “happiest animal in the world”, famous for selfies on Rottnest Island near Perth. Touching or feeding them is banned.","sameAs":"https://en.wikipedia.org/wiki/Quokka"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Tasmanian devil","description":"(Mammals) The biggest living carnivorous marsupial, found only in Tasmania. It screeches loudly and inspired Looney Tunes’ Taz.","sameAs":"https://en.wikipedia.org/wiki/Tasmanian_devil"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Brushtail possum","description":"(Mammals) Lives in the suburbs, in roofs and in parks. Noisy at night and easy to spot up in the trees.","sameAs":"https://en.wikipedia.org/wiki/Common_brushtail_possum"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Flying fox","description":"(Mammals) A giant fruit bat with a wingspan of up to 1 m. At sunset whole colonies cross the skies of Sydney and Brisbane.","sameAs":"https://en.wikipedia.org/wiki/Pteropus"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Dingo","description":"(Mammals) A wild dog that arrived around 3,500 to 4,000 years ago with seafaring peoples. Today it’s considered part of the native fauna.","sameAs":"https://en.wikipedia.org/wiki/Dingo"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Australian magpie","description":"(Birds) A black-and-white bird with a beautiful song. In spring some males swoop anyone who gets too close to the nest: it’s swooping season.","sameAs":"https://en.wikipedia.org/wiki/Australian_magpie"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Australian white ibis","description":"(Birds) The “bin chicken” that raids bins in the city. Really a wetland bird that has adapted to urban life.","sameAs":"https://en.wikipedia.org/wiki/Australian_white_ibis"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Sulphur-crested cockatoo","description":"(Birds) Loud and very clever. In Sydney it learned to open wheelie bins and taught the trick to other cockatoos.","sameAs":"https://en.wikipedia.org/wiki/Sulphur-crested_cockatoo"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Galah","description":"(Birds) A pink-and-grey cockatoo, common in flocks. “Galah” is also slang for a silly person.","sameAs":"https://en.wikipedia.org/wiki/Galah"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Kookaburra","description":"(Birds) The bird whose call sounds like laughter. The natural alarm clock of many Aussie suburbs.","sameAs":"https://en.wikipedia.org/wiki/Laughing_kookaburra"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Rainbow lorikeet","description":"(Birds) A small parrot in every colour, living in flocks in the flowering trees of eastern cities.","sameAs":"https://en.wikipedia.org/wiki/Rainbow_lorikeet"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Emu","description":"(Birds) The second-tallest bird in the world after the ostrich. Can’t fly but runs at 50 km/h. It’s on the national coat of arms.","sameAs":"https://en.wikipedia.org/wiki/Emu"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Cassowary","description":"(Birds) A huge bird of the far north Queensland rainforest, with a helmet on its head. An important seed spreader.","sameAs":"https://en.wikipedia.org/wiki/Southern_cassowary"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Brush turkey","description":"(Birds) Common in Brisbane and Sydney backyards. The male builds mounds of leaves that work as an incubator.","sameAs":"https://en.wikipedia.org/wiki/Australian_brushturkey"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Australian pelican","description":"(Birds) Has the biggest bill of any bird in the world. Turns up on beaches, rivers and lakes right around the country.","sameAs":"https://en.wikipedia.org/wiki/Australian_pelican"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Little penguin","description":"(Birds) The smallest penguin in the world, about 30 cm tall. On Phillip Island, near Melbourne, they parade ashore at dusk.","sameAs":"https://en.wikipedia.org/wiki/Little_penguin"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Blue-tongue lizard","description":"(Reptiles and others) A placid garden lizard that flashes its blue tongue when startled. Helps keep snails under control.","sameAs":"https://en.wikipedia.org/wiki/Blue-tongued_skink"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Goanna","description":"(Reptiles and others) A monitor lizard that can grow over 2 m. Common in national parks and picnic areas.","sameAs":"https://en.wikipedia.org/wiki/Goanna"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Saltwater crocodile","description":"(Reptiles and others) The biggest living reptile in the world, in northern rivers and coastlines. Obey the signs: no swimming where there’s a warning.","sameAs":"https://en.wikipedia.org/wiki/Saltwater_crocodile"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Huntsman spider","description":"(Reptiles and others) Big and scary-looking, but harmless to people. Often turns up inside cars and houses.","sameAs":"https://en.wikipedia.org/wiki/Huntsman_spider"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Eucalyptus","description":"(Plants and flowers) More than 700 species of “gum trees”, the tree that defines the Aussie landscape. The smell of the bush is the smell of eucalyptus.","sameAs":"https://en.wikipedia.org/wiki/Eucalyptus"}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Golden wattle","description":"(Plants and flowers) The national floral emblem, which inspired the green and gold. It flowers at the end of winter; 1 September is Wattle Day.","sameAs":"https://en.wikipedia.org/wiki/Acacia_pycnantha"}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Banksia","description":"(Plants and flowers) Cone-shaped flowers that feed birds and marsupials. Many only release their seeds after a fire.","sameAs":"https://en.wikipedia.org/wiki/Banksia"}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"Grevillea","description":"(Plants and flowers) Shrubs with curly, colourful, nectar-rich flowers. Found in almost every Aussie garden.","sameAs":"https://en.wikipedia.org/wiki/Grevillea"}},{"@type":"ListItem","position":32,"item":{"@type":"Thing","name":"Waratah","description":"(Plants and flowers) The huge red flower that is the emblem of New South Wales.","sameAs":"https://en.wikipedia.org/wiki/Telopea_speciosissima"}},{"@type":"ListItem","position":33,"item":{"@type":"Thing","name":"Kangaroo paw","description":"(Plants and flowers) A flower shaped like a kangaroo’s paw, the emblem of Western Australia.","sameAs":"https://en.wikipedia.org/wiki/Anigozanthos"}},{"@type":"ListItem","position":34,"item":{"@type":"Thing","name":"Bottlebrush","description":"(Plants and flowers) Red flowers that look just like the brushes used to clean bottles. They draw in lorikeets and bees.","sameAs":"https://en.wikipedia.org/wiki/Callistemon"}},{"@type":"ListItem","position":35,"item":{"@type":"Thing","name":"Paperbark","description":"(Plants and flowers) A tree whose bark peels off like paper. One species gives us tea tree oil, used in cosmetics.","sameAs":"https://en.wikipedia.org/wiki/Melaleuca"}},{"@type":"ListItem","position":36,"item":{"@type":"Thing","name":"Grass tree","description":"(Plants and flowers) A plant with a dark trunk and a tuft of fine leaves that grows about 1 cm a year. Some are hundreds of years old.","sameAs":"https://en.wikipedia.org/wiki/Xanthorrhoea"}},{"@type":"ListItem","position":37,"item":{"@type":"Thing","name":"Boab","description":"(Plants and flowers) The Australian baobab, with a fat bottle-shaped trunk, typical of the Kimberley.","sameAs":"https://en.wikipedia.org/wiki/Adansonia_gregorii"}},{"@type":"ListItem","position":38,"item":{"@type":"Thing","name":"Moreton Bay fig","description":"(Plants and flowers) A giant fig with aerial roots, common in Sydney and Brisbane parks. Shade guaranteed.","sameAs":"https://en.wikipedia.org/wiki/Ficus_macrophylla"}},{"@type":"ListItem","position":39,"item":{"@type":"Thing","name":"Wollemi pine","description":"(Plants and flowers) A tree from the age of the dinosaurs, known only from fossils until it was found alive in 1994 in a canyon near Sydney.","sameAs":"https://en.wikipedia.org/wiki/Wollemia"}},{"@type":"ListItem","position":40,"item":{"@type":"Thing","name":"Spinifex","description":"(Plants and flowers) Spiky grass that covers much of the outback and holds the red desert sand in place.","sameAs":"https://en.wikipedia.org/wiki/Triodia_(plant)"}},{"@type":"ListItem","position":41,"item":{"@type":"Thing","name":"Macadamia","description":"(Plants and flowers) A tree native to Queensland and NSW. The world’s most famous Australian nut.","sameAs":"https://en.wikipedia.org/wiki/Macadamia"}},{"@type":"ListItem","position":42,"item":{"@type":"Thing","name":"Bilby","description":"(Mammals) A long-eared desert marsupial. At Easter, plenty of Aussies swap the chocolate bunny for a chocolate bilby.","sameAs":"https://en.wikipedia.org/wiki/Greater_bilby"}},{"@type":"ListItem","position":43,"item":{"@type":"Thing","name":"Sugar glider","description":"(Mammals) A small nocturnal possum that glides from tree to tree on a membrane stretched between its legs.","sameAs":"https://en.wikipedia.org/wiki/Sugar_glider"}},{"@type":"ListItem","position":44,"item":{"@type":"Thing","name":"Numbat","description":"(Mammals) A striped marsupial that eats thousands of termites a day. Western Australia’s emblem, and endangered.","sameAs":"https://en.wikipedia.org/wiki/Numbat"}},{"@type":"ListItem","position":45,"item":{"@type":"Thing","name":"Tree-kangaroo","description":"(Mammals) Yes, some kangaroos live in trees. Lumholtz’s tree-kangaroo lives in the rainforests of far north Queensland.","sameAs":"https://en.wikipedia.org/wiki/Tree-kangaroo"}},{"@type":"ListItem","position":46,"item":{"@type":"Thing","name":"Superb fairywren","description":"(Birds) A tiny bird; in breeding season the male turns electric blue. Common in gardens and parks.","sameAs":"https://en.wikipedia.org/wiki/Superb_fairywren"}},{"@type":"ListItem","position":47,"item":{"@type":"Thing","name":"Black swan","description":"(Birds) Europeans thought black swans didn’t exist until they saw Australia’s. It’s the emblem of Western Australia.","sameAs":"https://en.wikipedia.org/wiki/Black_swan"}},{"@type":"ListItem","position":48,"item":{"@type":"Thing","name":"Willie wagtail","description":"(Birds) Small, black and white and not the least bit shy. Wags its tail from side to side non-stop.","sameAs":"https://en.wikipedia.org/wiki/Willie_wagtail"}},{"@type":"ListItem","position":49,"item":{"@type":"Thing","name":"Tawny frogmouth","description":"(Birds) Looks like an owl but isn’t. By day it sits dead still on a branch, disguised as a bit of tree.","sameAs":"https://en.wikipedia.org/wiki/Tawny_frogmouth"}},{"@type":"ListItem","position":50,"item":{"@type":"Thing","name":"Superb lyrebird","description":"(Birds) The bird world’s greatest mimic: it copies other birds, chainsaws and camera shutters. It’s on the 10-cent coin.","sameAs":"https://en.wikipedia.org/wiki/Superb_lyrebird"}},{"@type":"ListItem","position":51,"item":{"@type":"Thing","name":"Wedge-tailed eagle","description":"(Birds) Australia’s biggest bird of prey, soaring high over the outback.","sameAs":"https://en.wikipedia.org/wiki/Wedge-tailed_eagle"}},{"@type":"ListItem","position":52,"item":{"@type":"Thing","name":"Crimson rosella","description":"(Birds) A red-and-blue parrot of the eastern forests and a regular at mountain picnics.","sameAs":"https://en.wikipedia.org/wiki/Crimson_rosella"}},{"@type":"ListItem","position":53,"item":{"@type":"Thing","name":"Frill-necked lizard","description":"(Reptiles and others) Flares a huge frill around its head to scare off anyone who gets too close. It used to be on the 2-cent coin.","sameAs":"https://en.wikipedia.org/wiki/Frilled_lizard"}},{"@type":"ListItem","position":54,"item":{"@type":"Thing","name":"Green tree frog","description":"(Reptiles and others) A chubby, smiley frog that loves turning up in Queensland bathrooms and water tanks.","sameAs":"https://en.wikipedia.org/wiki/Australian_green_tree_frog"}},{"@type":"ListItem","position":55,"item":{"@type":"Thing","name":"Thorny devil","description":"(Reptiles and others) A spiky desert lizard that drinks through its skin, along channels that carry water to its mouth.","sameAs":"https://en.wikipedia.org/wiki/Thorny_devil"}},{"@type":"ListItem","position":56,"item":{"@type":"Thing","name":"Humpback whale","description":"(Marine life) Between May and November, tens of thousands migrate along the east and west coasts. You can spot them from the beach.","sameAs":"https://en.wikipedia.org/wiki/Humpback_whale"}},{"@type":"ListItem","position":57,"item":{"@type":"Thing","name":"Green sea turtle","description":"(Marine life) Nests on Great Barrier Reef beaches. The hatchlings race to the sea at night.","sameAs":"https://en.wikipedia.org/wiki/Green_sea_turtle"}},{"@type":"ListItem","position":58,"item":{"@type":"Thing","name":"Dugong","description":"(Marine life) The “sea cow” that grazes on seagrass in places like Moreton Bay and Shark Bay.","sameAs":"https://en.wikipedia.org/wiki/Dugong"}},{"@type":"ListItem","position":59,"item":{"@type":"Thing","name":"Leafy seadragon","description":"(Marine life) A seahorse relative that looks like floating seaweed. South Australia’s marine emblem.","sameAs":"https://en.wikipedia.org/wiki/Leafy_seadragon"}},{"@type":"ListItem","position":60,"item":{"@type":"Thing","name":"Sturt’s desert pea","description":"(Plants and flowers) A red flower with a glossy black centre that paints the desert. South Australia’s floral emblem.","sameAs":"https://en.wikipedia.org/wiki/Swainsona_formosa"}},{"@type":"ListItem","position":61,"item":{"@type":"Thing","name":"Cooktown orchid","description":"(Plants and flowers) A purple orchid from the northern forests, Queensland’s floral emblem.","sameAs":"https://en.wikipedia.org/wiki/Dendrobium_bigibbum"}},{"@type":"ListItem","position":62,"item":{"@type":"Thing","name":"Common heath","description":"(Plants and flowers) A shrub with little bell-shaped pink or white flowers. Victoria’s floral emblem.","sameAs":"https://en.wikipedia.org/wiki/Epacris_impressa"}},{"@type":"ListItem","position":63,"item":{"@type":"Thing","name":"Sturt’s desert rose","description":"(Plants and flowers) A mauve flower of the arid lands, the Northern Territory’s floral emblem.","sameAs":"https://en.wikipedia.org/wiki/Gossypium_sturtianum"}},{"@type":"ListItem","position":64,"item":{"@type":"Thing","name":"Tasmanian blue gum","description":"(Plants and flowers) A tall tree with bluish leaves, Tasmania’s floral emblem and one of the most planted trees in the world.","sameAs":"https://en.wikipedia.org/wiki/Eucalyptus_globulus"}},{"@type":"ListItem","position":65,"item":{"@type":"Thing","name":"Royal bluebell","description":"(Plants and flowers) A little blue grassland flower, the ACT’s floral emblem.","sameAs":"https://en.wikipedia.org/wiki/Wahlenbergia_gloriosa"}},{"@type":"ListItem","position":66,"item":{"@type":"Thing","name":"River red gum","description":"(Plants and flowers) The giant eucalypt that lines inland rivers. It can live for more than 500 years.","sameAs":"https://en.wikipedia.org/wiki/Eucalyptus_camaldulensis"}},{"@type":"ListItem","position":67,"item":{"@type":"Thing","name":"Tree fern","description":"(Plants and flowers) Ferns with trunks several metres tall, typical of the cool forests of the south-east and Tasmania.","sameAs":"https://en.wikipedia.org/wiki/Dicksonia_antarctica"}},{"@type":"ListItem","position":68,"item":{"@type":"Thing","name":"Lilly pilly","description":"(Plants and flowers) A tree with edible pink berries, very popular as a backyard hedge.","sameAs":"https://en.wikipedia.org/wiki/Syzygium"}},{"@type":"ListItem","position":69,"item":{"@type":"Thing","name":"Queensland bottle tree","description":"(Plants and flowers) A fat, bottle-shaped trunk where the tree stores water for the dry.","sameAs":"https://en.wikipedia.org/wiki/Brachychiton_rupestris"}}]}]}</script>
