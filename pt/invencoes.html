<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Invenções","url":"https://australianculture.biblioverse.org/pt/invencoes.html","numberOfItems":25,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Bumerangue","description":"(Povos originários · milênios) Ferramenta aerodinâmica de caça e de guerra dos povos aborígenes; alguns tipos voltam para quem lança.","sameAs":"https://pt.wikipedia.org/wiki/Bumerangue"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Woomera","description":"(Povos originários · milênios) Propulsor que aumenta o alcance e a força do arremesso de lanças.","sameAs":"https://en.wikipedia.org/wiki/Woomera_(spear-thrower)"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Didgeridoo","description":"(Povos originários · milênios) Instrumento de sopro feito de tronco escavado por cupins, do norte da Austrália.","sameAs":"https://pt.wikipedia.org/wiki/Didjeridu"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Refrigeração mecânica","description":"(Cotidiano · 1856) James Harrison criou uma das primeiras máquinas de fazer gelo em Geelong, abrindo caminho para exportar carne congelada.","sameAs":"https://pt.wikipedia.org/wiki/James_Harrison_(engenheiro)"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Voto secreto","description":"(Sociedade · 1856) Criado em Victoria e South Australia, o \"Australian ballot\" foi copiado pelo mundo todo.","sameAs":"https://pt.wikipedia.org/wiki/Voto_secreto"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Futebol australiano","description":"(Sociedade · 1858) Tom Wills ajudou a criar as regras para manter os jogadores de críquete em forma no inverno. Hoje é a AFL.","sameAs":"https://pt.wikipedia.org/wiki/Futebol_australiano"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Furadeira elétrica","description":"(Cotidiano · 1889) Arthur James Arnot e William Blanch Brain criaram a primeira, em Melbourne, para perfurar rocha e carvão.","sameAs":"https://en.wikipedia.org/wiki/Arthur_James_Arnot"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Primeiro longa-metragem","description":"(Sociedade · 1906) The Story of the Kelly Gang, sobre o fora da lei Ned Kelly, é considerado o primeiro longa narrativo do mundo.","sameAs":"https://pt.wikipedia.org/wiki/The_Story_of_the_Kelly_Gang"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Marca-passo","description":"(Saúde · 1926) Mark Lidwill e o físico Edgar Booth usaram um aparelho portátil para reanimar um bebê em Sydney.","sameAs":"https://pt.wikipedia.org/wiki/Marca-passo"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Penicilina em escala","description":"(Saúde · 1940s) O australiano Howard Florey transformou a descoberta de Fleming em remédio. Nobel de 1945 e milhões de vidas salvas.","sameAs":"https://pt.wikipedia.org/wiki/Howard_Florey"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Varal giratório Hills Hoist","description":"(Cotidiano · 1945) O varal em forma de guarda-chuva que existe em todo quintal australiano. Lance Hill o produziu em Adelaide.","sameAs":"https://en.wikipedia.org/wiki/Hills_Hoist"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Caixa-preta","description":"(Tecnologia · 1956) David Warren, de Melbourne, criou o gravador de voz e de dados de voo, hoje obrigatório em todo avião.","sameAs":"https://pt.wikipedia.org/wiki/Caixa_negra"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Lentes plásticas de óculos","description":"(Saúde · 1960) Desenvolvidas em Adelaide pela SOLA, cerca de 60% mais leves que as de vidro.","sameAs":"https://en.wikipedia.org/wiki/Timeline_of_Australian_inventions"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Ultrassom médico","description":"(Saúde · 1960s) O laboratório de pesquisa em ultrassom do governo australiano criou aparelhos pioneiros de imagem para gestantes.","sameAs":"https://pt.wikipedia.org/wiki/Ultrassonografia"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Escorregador inflável de avião","description":"(Tecnologia · 1965) Jack Grant, funcionário da Qantas, criou a rampa inflável de evacuação que vira bote.","sameAs":"https://en.wikipedia.org/wiki/Evacuation_slide"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Vinho em caixa","description":"(Cotidiano · 1965) O \"goon bag\": vinho em bolsa plástica dentro da caixa, criado por Tom Angove. Clássico de mochileiro.","sameAs":"https://en.wikipedia.org/wiki/Box_wine"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Permacultura","description":"(Sociedade · 1978) Bill Mollison e David Holmgren, da Tasmânia, criaram o sistema de agricultura sustentável hoje usado no mundo todo.","sameAs":"https://pt.wikipedia.org/wiki/Permacultura"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Implante coclear","description":"(Saúde · 1978) Graeme Clark criou o \"ouvido biônico\" multicanal em Melbourne, que devolveu a audição a centenas de milhares de pessoas.","sameAs":"https://pt.wikipedia.org/wiki/Implante_coclear"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Descarga dupla","description":"(Cotidiano · 1980) Bruce Thompson, da Caroma, criou o botão de meia e descarga completa para economizar água.","sameAs":"https://en.wikipedia.org/wiki/Dual_flush_toilet"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"CPAP","description":"(Saúde · 1981) Colin Sullivan, de Sydney, criou a máscara que trata a apneia do sono. Deu origem à empresa ResMed.","sameAs":"https://pt.wikipedia.org/wiki/Press%C3%A3o_positiva_cont%C3%ADnua_na_via_a%C3%A9rea"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Notas de plástico","description":"(Tecnologia · 1988) O Banco Central e o CSIRO criaram as primeiras notas de polímero: duram mais e são difíceis de falsificar. O Brasil usou o mesmo material na nota de R$10 comemorativa de 2000.","sameAs":"https://en.wikipedia.org/wiki/Polymer_banknote"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Wi-Fi","description":"(Tecnologia · 1992) Uma equipe do CSIRO, liderada por John O'Sullivan, patenteou a tecnologia que tornou o Wi-Fi rápido e estável.","sameAs":"https://pt.wikipedia.org/wiki/Wi-Fi"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Spray de pele","description":"(Saúde · 1990s) Fiona Wood, de Perth, criou um spray com células do paciente para tratar queimaduras. Usado nas vítimas do atentado em Bali (2002).","sameAs":"https://en.wikipedia.org/wiki/Fiona_Wood"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Vacina contra HPV","description":"(Saúde · 2006) Ian Frazer e o chinês Jian Zhou desenvolveram em Brisbane a tecnologia da vacina que previne o câncer de colo de útero.","sameAs":"https://pt.wikipedia.org/wiki/Vacina_contra_o_HPV"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Google Maps","description":"(Tecnologia · 2005) Os irmãos dinamarqueses Lars e Jens Rasmussen criaram o mapa em Sydney, na startup Where 2, comprada pelo Google em 2004.","sameAs":"https://pt.wikipedia.org/wiki/Google_Maps"}}]}]}</script>
