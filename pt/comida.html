<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"No prato de todo dia","url":"https://australianculture.biblioverse.org/pt/comida.html","numberOfItems":6,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Frutas e verduras","description":"Manga, abacate, banana e macadâmia, muitas cultivadas no próprio país."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Pão e torrada","description":"Torrada no café da manhã, com Vegemite ou manteiga."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Comida asiática","description":"Thai, chinesa, vietnamita e indiana são o \"delivery\" de todo dia."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Café de cafeteria","description":"Flat white e long black, nada de café coado."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Fish and chips","description":"Peixe empanado com fritas, de preferência na praia."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Italiana e grega","description":"Herança da imigração do pós-guerra, sobretudo em Melbourne."}}]},{"@type":"ItemList","name":"Ícones, pratos, doces e bebidas","url":"https://australianculture.biblioverse.org/pt/comida.html","numberOfItems":28,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Vegemite","description":"(Ícones · 1923) Pasta escura e salgada de extrato de levedura, criada por Cyril Callister em Melbourne. Vai em fina camada (bem fina!) sobre torrada com manteiga. Rica em vitaminas B.","sameAs":"https://pt.wikipedia.org/wiki/Vegemite"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Tim Tam","description":"(Ícones · 1964) Biscoito de chocolate da Arnott's. O ritual é o \"Tim Tam Slam\": morda as pontas e use como canudo para beber café ou chocolate quente.","sameAs":"https://en.wikipedia.org/wiki/Tim_Tam"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Anzac biscuits","description":"(Ícones · 1915) Biscoito de aveia, coco e golden syrup, ligado aos soldados da Primeira Guerra. Por lei, o nome \"Anzac\" é protegido e não pode ser chamado de \"cookie\".","sameAs":"https://en.wikipedia.org/wiki/Anzac_biscuit"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Meat pie","description":"(Ícones · 1800s) A torta individual de recheio salgado com tomato sauce, lanche oficial do estádio de footy. Hoje quase toda padaria tem versões vegetarianas e veganas.","sameAs":"https://en.wikipedia.org/wiki/Meat_pie_(Australia_and_New_Zealand)"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Pavlova","description":"(Ícones · 1920s) Merengue crocante por fora e macio por dentro, com chantili e frutas. Homenageia a bailarina Anna Pavlova. A Nova Zelândia também reivindica a criação.","sameAs":"https://pt.wikipedia.org/wiki/Pavlova"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Lamington","description":"(Ícones · 1900) Quadradinho de pão de ló coberto de chocolate e coco ralado. Tem até o Dia Nacional do Lamington (21 de julho).","sameAs":"https://en.wikipedia.org/wiki/Lamington"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Fairy bread","description":"(Ícones · 1920s) Pão de forma com manteiga e granulado colorido, cortado em triângulos. Obrigatório em festa infantil.","sameAs":"https://en.wikipedia.org/wiki/Fairy_bread"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Sausage sizzle","description":"(Pratos e tradições) Pão com linguiça (hoje quase sempre com opção vegetariana), vendido para arrecadar fundos em feiras, escolas e no dia da eleição: a famosa \"democracy sausage\".","sameAs":"https://en.wikipedia.org/wiki/Sausage_sizzle"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Barbie (churrasco)","description":"(Pratos e tradições) Churrasqueiras elétricas públicas e gratuitas em praticamente todo parque. O encontro em volta da churrasqueira é o programa social mais australiano que existe.","sameAs":"https://en.wikipedia.org/wiki/Barbecue"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Smashed avo","description":"(Pratos e tradições) Torrada com abacate amassado, o símbolo do brunch australiano. Um colunista culpou o prato pelos jovens não conseguirem comprar casa (2016).","sameAs":"https://en.wikipedia.org/wiki/Avocado_toast"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Manga Bowen","description":"(Pratos e tradições · verão) A manga de Queensland é a fruta do Natal australiano: as caixas chegam aos mercados em dezembro e todo mundo compra.","sameAs":"https://en.wikipedia.org/wiki/Kensington_Pride"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Damper","description":"(Pratos e tradições) Pão simples de farinha e água assado na brasa, comida dos viajantes do outback.","sameAs":"https://en.wikipedia.org/wiki/Damper_(food)"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Frutos do mar no Natal","description":"(Pratos e tradições) Como o Natal cai no verão, a ceia é leve e fria, com saladas, frutas, pavlova e sorvete, de preferência na praia ou no parque.","sameAs":"https://en.wikipedia.org/wiki/Christmas_in_Australia"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Golden Gaytime","description":"(Doces e snacks · 1959) Picolé de toffee com baunilha e cobertura de biscoito. O slogan clássico: \"It's hard to have a Gaytime on your own\".","sameAs":"https://en.wikipedia.org/wiki/Golden_Gaytime"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Caramello Koala","description":"(Doces e snacks) Chocolate em formato de coala com recheio de caramelo, da Cadbury.","sameAs":"https://en.wikipedia.org/wiki/Caramello_Koala"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Freddo Frog","description":"(Doces e snacks · 1930) O sapinho de chocolate da infância australiana. O preço (que já foi 20 centavos) é um termômetro da inflação.","sameAs":"https://en.wikipedia.org/wiki/Freddo"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Iced VoVo","description":"(Doces e snacks) Biscoito com fondant rosa, geleia de framboesa e coco.","sameAs":"https://en.wikipedia.org/wiki/Iced_VoVo"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Shapes","description":"(Doces e snacks · 1976) Biscoitos salgados da Arnott's em sabores como Pizza e Barbecue. A mudança de receita em 2015 gerou revolta nacional.","sameAs":"https://en.wikipedia.org/wiki/Arnott%27s_Shapes"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Twisties","description":"(Doces e snacks) Salgadinho de milho com queijo, primo do Cheetos.","sameAs":"https://en.wikipedia.org/wiki/Twisties"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Cherry Ripe","description":"(Doces e snacks · 1924) A barra de chocolate mais antiga do país: cereja e coco cobertos de chocolate amargo.","sameAs":"https://en.wikipedia.org/wiki/Cherry_Ripe_(chocolate_bar)"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Weet-Bix","description":"(Doces e snacks) Bloquinhos de trigo integral do café da manhã. \"Aussie kids are Weet-Bix kids\".","sameAs":"https://en.wikipedia.org/wiki/Weet-Bix"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Milo","description":"(Bebidas · 1934) Achocolatado em pó criado em Sydney por Thomas Mayne. Bom mesmo é comer o pó crocante por cima do leite gelado.","sameAs":"https://en.wikipedia.org/wiki/Milo_(drink)"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Flat white","description":"(Bebidas · 1980s) Espresso com leite vaporizado e pouca espuma. Austrália e Nova Zelândia disputam quem inventou. Melbourne é a capital do café.","sameAs":"https://pt.wikipedia.org/wiki/Flat_white"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Lemon, lime & bitters","description":"(Bebidas) Refrigerante de limão com gotas de Angostura. A bebida de pub de quem não vai beber álcool.","sameAs":"https://en.wikipedia.org/wiki/Lemon,_lime_and_bitters"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Bundy & Coke","description":"(Bebidas) Rum Bundaberg com Coca-Cola, com o urso polar na garrafa.","sameAs":"https://en.wikipedia.org/wiki/Bundaberg_Rum"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Macadâmia","description":"(Bush tucker (nativos)) Nativa de Queensland e NSW, é a única noz australiana cultivada em escala comercial no mundo todo.","sameAs":"https://pt.wikipedia.org/wiki/Macadamia"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Wattleseed","description":"(Bush tucker (nativos)) Semente de acácia torrada com sabor de café e chocolate, usada há milênios pelos povos aborígenes.","sameAs":"https://en.wikipedia.org/wiki/Wattleseed"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Finger lime","description":"(Bush tucker (nativos)) O \"caviar cítrico\": um limão em forma de dedo cheio de bolinhas azedas. Queridinho dos chefs.","sameAs":"https://pt.wikipedia.org/wiki/Citrus_australasica"}}]}]}</script>
