<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Curiosidades","url":"https://australianculture.biblioverse.org/pt/curiosidades.html","numberOfItems":25,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Nome e cores oficiais","description":"O nome oficial é Comunidade da Austrália (Commonwealth of Australia). As cores nacionais são o verde e o dourado, das flores e folhas da acácia-dourada (golden wattle), oficializadas em 1984 e usadas pelas seleções do país."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Um hino sem guerra nem religião","description":"O hino, Advance Australia Fair, não tem referências militares nem religiosas. A versão original, de 1879, era bem mais imperial: uma estrofe elogiava o Capitão Cook e terminava com “Britannia rules the wave” (a Britânia governa as ondas), verso tirado da canção patriótica britânica Rule, Britannia!, e outra chamava os australianos às armas contra invasores. Essas estrofes caíram quando a música virou o hino oficial, em 1984. Em 2021, “young and free” (jovens e livres) virou “one and free” (unidos e livres), em reconhecimento aos povos indígenas."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Mais canguru que gente","description":"São mais de 40 milhões de cangurus para cerca de 28 milhões de pessoas."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Todo mundo no litoral","description":"Cerca de 85% da população vive a menos de 50 km da costa. O interior é praticamente vazio."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Um país seco","description":"Cerca de 70% do território é árido ou semiárido. É o continente habitado mais seco do planeta."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Mais larga que a Lua","description":"De leste a oeste a Austrália tem uns 4.000 km. O diâmetro da Lua é de 3.474 km."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"O continente anda","description":"A placa australiana se move uns 7 cm por ano para o norte. Em 2017 o país ajustou as coordenadas de GPS em 1,8 m."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Capital por empate","description":"Sydney e Melbourne brigavam para ser a capital, então construíram Canberra no meio do caminho, de propósito."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Natal no verão","description":"Papai Noel de bermuda, ceia de frutos do mar e o teste de críquete de Boxing Day (26 de dezembro)."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Thongs são chinelos","description":"Se um australiano disser que esqueceu os thongs, ele está falando de chinelo de dedo."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Tudo é abreviado","description":"Brekkie (café da manhã), arvo (tarde), servo (posto), avo (abacate), sunnies (óculos de sol), Chrissie (Natal)."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Sem idioma oficial","description":"O inglês é a língua principal, mas nenhuma lei o define como oficial. Antes da colonização havia mais de 250 línguas indígenas."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Um terço nasceu fora","description":"Cerca de 32% da população nasceu em outro país. Quase metade tem pai ou mãe estrangeiro."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Cocô em cubo","description":"O wombat é o único animal conhecido que faz cocô em formato de cubo."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"O ornitorrinco","description":"Mamífero que bota ovos, tem bico de pato e o macho tem esporão venenoso. Os cientistas europeus acharam que era fraude."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"O brasão que não anda para trás","description":"Canguru e emu estão no brasão, e diz a tradição que é porque raramente andam para trás, só para frente."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Slip, Slop, Slap","description":"O país tem uma das maiores taxas de câncer de pele do mundo. Nas escolas vale a regra \"No hat, no play\"."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Mão inglesa","description":"Dirige-se do lado esquerdo, herança britânica. Pedestre, olhe para a direita primeiro!"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Gorjeta não é obrigatória","description":"Os salários são altos, então ninguém espera gorjeta, embora seja bem-vinda em restaurante."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"O ar mais limpo","description":"A estação de Cape Grim, na Tasmânia, mede um dos ares mais puros do planeta."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"O premiê que sumiu","description":"O primeiro-ministro Harold Holt desapareceu nadando no mar em 1967. Anos depois inauguraram uma piscina com o nome dele."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Coala dorme 20 horas","description":"A dieta de eucalipto dá pouquíssima energia, então o coala dorme quase o dia inteiro."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Mais de 10 mil praias","description":"São 10.685 praias. Visitando uma por dia, levaria quase 30 anos."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Biossegurança é sério","description":"Esquecer de declarar uma fruta ou semente na chegada pode dar multa de milhares de dólares."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Fusos que mudam","description":"São 3 fusos principais, mas como QLD, WA e NT não adotam horário de verão, no verão o país chega a ter 5 horários diferentes."}}]}]}</script>
