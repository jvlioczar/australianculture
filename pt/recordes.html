<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Recordes e índices","url":"https://australianculture.biblioverse.org/pt/recordes.html","numberOfItems":18,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Highway 1","description":"(Geografia · 14.500 km) A maior rodovia nacional do mundo, dando a volta no país inteiro.","sameAs":"https://pt.wikipedia.org/wiki/Highway_1"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Nullarbor Links","description":"(Geografia · 1.365 km) O maior campo de golfe do mundo: 18 buracos espalhados pela Eyre Highway, entre SA e WA.","sameAs":"https://en.wikipedia.org/wiki/Nullarbor_Links"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Dingo Fence","description":"(Geografia · 5.614 km) A maior cerca do mundo, construída para manter os dingos longe das ovelhas no sudeste.","sameAs":"https://pt.wikipedia.org/wiki/Cerca_dos_Dingos"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"90 Mile Straight","description":"(Geografia · 146,6 km) A maior reta de estrada asfaltada do país, na Eyre Highway.","sameAs":"https://en.wikipedia.org/wiki/Eyre_Highway"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Reta ferroviária","description":"(Geografia · 478 km) O trecho de trilho reto mais longo do mundo, na planície de Nullarbor.","sameAs":"https://en.wikipedia.org/wiki/Trans-Australian_Railway"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Grande Barreira de Corais","description":"(Natureza · 2.300 km) O maior sistema de recifes do planeta, visível do espaço.","sameAs":"https://pt.wikipedia.org/wiki/Grande_Barreira_de_Coral"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"K'gari (Fraser Island)","description":"(Natureza · 1.840 km²) A maior ilha de areia do mundo, com lagos de água doce e floresta tropical.","sameAs":"https://pt.wikipedia.org/wiki/Ilha_Fraser"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Grande Bacia Artesiana","description":"(Natureza · 1,7 mi km²) Uma das maiores reservas de água subterrânea do mundo, debaixo de 22% do país.","sameAs":"https://en.wikipedia.org/wiki/Great_Artesian_Basin"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Cultura viva mais antiga","description":"(Sociedade · 60 mil+ anos) Os povos aborígenes e das Ilhas do Estreito de Torres têm a cultura contínua mais antiga da Terra.","sameAs":"https://pt.wikipedia.org/wiki/Abor%C3%ADgenes_australianos"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Maior país","description":"(Índices · 6º) 7,69 milhões de km², quase o tamanho do Brasil (8,5 milhões). E o único país que ocupa um continente inteiro.","sameAs":"https://pt.wikipedia.org/wiki/Lista_de_Estados_por_%C3%A1rea_territorial"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Salário mínimo","description":"(Índices · A$ 26,44/h) O salário mínimo nacional desde julho de 2026 (A$1.004,90 por semana), um dos mais altos do mundo.","sameAs":"https://en.wikipedia.org/wiki/Minimum_wage_in_Australia"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Prêmios Nobel","description":"(Índices · 15) Oito deles em Medicina, como Howard Florey (penicilina) e Peter Doherty (sistema imune). Patrick White ganhou o de Literatura em 1973.","sameAs":"https://en.wikipedia.org/wiki/List_of_Australian_Nobel_laureates"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Comparecimento às urnas","description":"(Sociedade · ~90%) O voto é obrigatório desde 1924 e quem falta leva multa. O resultado é um dos maiores comparecimentos do mundo.","sameAs":"https://en.wikipedia.org/wiki/Electoral_system_of_Australia"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Voto feminino","description":"(Sociedade · 1902) Um dos primeiros países a dar às mulheres o direito de votar e de se candidatar em eleições nacionais.","sameAs":"https://en.wikipedia.org/wiki/Women%27s_suffrage_in_Australia"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"MCG","description":"(Sociedade · 100.024) O Melbourne Cricket Ground é o maior estádio do hemisfério sul e o maior de críquete do mundo.","sameAs":"https://pt.wikipedia.org/wiki/Melbourne_Cricket_Ground"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Perdas com apostas","description":"(Índices · 1º) Australianos são os que mais perdem dinheiro com jogos de azar por pessoa no mundo, puxados pelas \"pokies\" (caça-níqueis).","sameAs":"https://en.wikipedia.org/wiki/Gambling_in_Australia"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Cobra mais venenosa","description":"(Natureza · 1ª) A taipan-do-interior tem o veneno mais potente entre as cobras terrestres. Ela é tímida e vive longe de tudo.","sameAs":"https://pt.wikipedia.org/wiki/Taipan-do-interior"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Monte Augustus","description":"(Natureza · 858 m) Considerado o maior monólito do mundo, com o dobro do tamanho do Uluru.","sameAs":"https://en.wikipedia.org/wiki/Mount_Augustus_National_Park"}}]}]}</script>
