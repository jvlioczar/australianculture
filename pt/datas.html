<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://australianculture.biblioverse.org/pt/datas.html#page","url":"https://australianculture.biblioverse.org/pt/datas.html","name":"Datas importantes — Cultura Australiana","description":"Feriados e datas importantes da Austrália, do Australia Day ao Anzac Day e à Semana NAIDOC, com a crítica dos povos indígenas quando há.","inLanguage":"pt-BR","isPartOf":{"@id":"https://australianculture.biblioverse.org/#website"},"primaryImageOfPage":"https://australianculture.biblioverse.org/images/share-18-pt-3.png","dateModified":"2026-11-01","breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Cultura Australiana","item":"https://australianculture.biblioverse.org/pt/"},{"@type":"ListItem","position":2,"name":"Datas importantes","item":"https://australianculture.biblioverse.org/pt/datas.html"}]}}]}</script>
<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Datas importantes","url":"https://australianculture.biblioverse.org/pt/datas.html","numberOfItems":21,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Ano-Novo e a Federação","description":"(Feriados · 1º de janeiro) O ano começa com os fogos sobre a Harbour Bridge e a Opera House, assistidos no mundo inteiro. A data também marca a Federação: em 1º de janeiro de 1901 as seis colônias se uniram e nasceu a Comunidade da Austrália. Olhar indígena: A Constituição de 1901 mandava não contar os aborígenes na população. Esse trecho só caiu no referendo de 1967.","sameAs":"https://pt.wikipedia.org/wiki/Federação_da_Austrália"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Australia Day","description":"(Feriados · 26 de janeiro) Feriado nacional que lembra a chegada da Primeira Frota a Sydney Cove em 1788. Tem churrasco, praia, cerimônias de cidadania e, na véspera, o anúncio do Australiano do Ano. Olhar indígena: Para muitos aborígenes e ilhéus do Estreito de Torres é o Invasion Day (Dia da Invasão) ou Survival Day (Dia da Sobrevivência), com marchas em todo o país. O protesto vem de longe: em 26 de janeiro de 1938 houve o Day of Mourning (Dia de Luto) em Sydney. O debate sobre mudar a data cresce, e em 2018 a rádio triple j tirou dela o seu Hottest 100.","sameAs":"https://pt.wikipedia.org/wiki/Dia_da_Austrália"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Aniversário do Pedido de Desculpas","description":"(Datas indígenas · 13 de fevereiro) Em 13 de fevereiro de 2008 o primeiro-ministro Kevin Rudd pediu desculpas, no Parlamento, às Gerações Roubadas: as crianças aborígenes tiradas das famílias por políticas do governo. A data é lembrada todo ano.","sameAs":"https://en.wikipedia.org/wiki/Apology_to_Australia%27s_Indigenous_peoples"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Sydney Mardi Gras","description":"(Cultura e comunidade · Fevereiro ou março) O desfile LGBTQIA+ da Oxford Street, um dos maiores do mundo. Começou em 1978 como protesto, quando dezenas de manifestantes foram presos pela polícia.","sameAs":"https://en.wikipedia.org/wiki/Sydney_Gay_and_Lesbian_Mardi_Gras"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Clean Up Australia Day","description":"(Cultura e comunidade · Primeiro domingo de março) Voluntários do país inteiro recolhem lixo de praias, parques e rios. A ideia nasceu em 1989 com o velejador Ian Kiernan, revoltado com a sujeira que viu no mar.","sameAs":"https://en.wikipedia.org/wiki/Clean_Up_Australia"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Labour Day","description":"(Feriados · Março, maio ou outubro) O feriado do trabalhador cai em datas diferentes em cada estado. Celebra a conquista das oito horas de trabalho por dia, arrancada pelos pedreiros de Melbourne em 1856, uma das primeiras do mundo.","sameAs":"https://en.wikipedia.org/wiki/Labour_Day"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Harmony Day","description":"(Cultura e comunidade · 21 de março) Dia da diversidade cultural, com escolas e escritórios vestidos de laranja. Cai no Dia Internacional da ONU pela Eliminação da Discriminação Racial. Olhar indígena: Críticos, incluindo lideranças indígenas, dizem que o nome “harmonia” suaviza a data e tira o foco do combate ao racismo, que era o objetivo da ONU.","sameAs":"https://en.wikipedia.org/wiki/Harmony_Day"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Páscoa","description":"(Feriados · Março ou abril) Feriado prolongado, da Sexta-Feira Santa à segunda-feira de Páscoa. Além do coelho, há o bilby de chocolate: os coelhos são uma praga no país, e o bilby é um marsupial nativo ameaçado.","sameAs":"https://pt.wikipedia.org/wiki/Páscoa"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Anzac Day","description":"(Memória · 25 de abril) O dia mais solene do país lembra o desembarque em Gallipoli, em 1915, e todos os que serviram nas guerras. Começa com cerimônias ao amanhecer e segue com desfiles e o jogo de two-up nos pubs. Olhar indígena: Soldados aborígenes lutaram nas guerras mundiais e, de volta, foram excluídos de terras e benefícios dados aos outros veteranos. Muitos também pedem que as Guerras de Fronteira, entre colonos e povos aborígenes, sejam lembradas como as outras guerras.","sameAs":"https://pt.wikipedia.org/wiki/Dia_ANZAC"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Dia das Mães","description":"(Cultura e comunidade · Segundo domingo de maio) Café na cama e flores, como no Brasil. A flor tradicional é o crisântemo: floresce em maio, e o apelido dele em inglês, mum, também quer dizer mãe.","sameAs":"https://pt.wikipedia.org/wiki/Dia_das_Mães"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"National Sorry Day","description":"(Datas indígenas · 26 de maio) Dia de lembrar as Gerações Roubadas. É realizado desde 1998, um ano depois do relatório Bringing Them Home, que revelou a dimensão das retiradas de crianças.","sameAs":"https://en.wikipedia.org/wiki/National_Sorry_Day"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Semana Nacional da Reconciliação","description":"(Datas indígenas · 27 de maio a 3 de junho) Semana para aproximar os australianos dos povos originários. As datas lembram duas vitórias: o referendo de 1967 (27 de maio) e a decisão Mabo de 1992 (3 de junho), que reconheceu o direito indígena à terra.","sameAs":"https://en.wikipedia.org/wiki/National_Reconciliation_Week"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Aniversário do Rei","description":"(Feriados · Segunda segunda-feira de junho) Feriado em homenagem ao monarca, na maioria dos estados em junho (Queensland e Austrália Ocidental usam outras datas). Não é o aniversário de verdade do rei Charles III, que é em novembro. Olhar indígena: Para muitos indígenas, a Coroa é a origem da colonização, e a data costuma vir junto com o debate sobre a Austrália virar república.","sameAs":"https://pt.wikipedia.org/wiki/Aniversário_do_Rei"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Semana NAIDOC","description":"(Datas indígenas · Primeira semana de julho) A grande celebração da história, da cultura e das conquistas dos aborígenes e ilhéus do Estreito de Torres, com eventos no país inteiro. As raízes estão nos protestos de 1938.","sameAs":"https://en.wikipedia.org/wiki/NAIDOC_Week"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Dia das Crianças Aborígenes e Ilhéus","description":"(Datas indígenas · 4 de agosto) Celebra as crianças dos povos originários desde 1988. A data foi escolhida porque, nas Gerações Roubadas, muitas crianças não sabiam o próprio aniversário e comemoravam nesse dia."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Dia dos Pais","description":"(Cultura e comunidade · Primeiro domingo de setembro) Diferente do Brasil, onde é em agosto: aqui o Dia dos Pais cai na primavera, em setembro.","sameAs":"https://pt.wikipedia.org/wiki/Dia_dos_Pais"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"R U OK? Day","description":"(Cultura e comunidade · Segunda quinta-feira de setembro) Dia para perguntar a amigos, família e colegas: “Are you OK?” (Você está bem?). Criado em 2009 para combater o suicídio e incentivar conversas sobre saúde mental.","sameAs":"https://en.wikipedia.org/wiki/R_U_OK%3F"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"AFL Grand Final","description":"(Cultura e comunidade · Fim de setembro) A final do futebol australiano no MCG, em Melbourne. Em Victoria a sexta-feira antes do jogo é feriado.","sameAs":"https://en.wikipedia.org/wiki/AFL_Grand_Final"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Remembrance Day","description":"(Memória · 11 de novembro) Às 11h o país faz um minuto de silêncio, a hora em que a Primeira Guerra terminou, em 1918. As pessoas usam papoulas vermelhas na lapela.","sameAs":"https://pt.wikipedia.org/wiki/Dia_da_Lembrança"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Natal","description":"(Feriados · 25 de dezembro) Natal no verão: praia, piscina, pavlova e o Carols by Candlelight, o concerto de canções natalinas à luz de velas em Melbourne.","sameAs":"https://en.wikipedia.org/wiki/Christmas_in_Australia"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Boxing Day","description":"(Feriados · 26 de dezembro) Dia de liquidações, do Boxing Day Test de críquete no MCG e da largada da regata Sydney–Hobart, que lota a baía de Sydney de barcos.","sameAs":"https://en.wikipedia.org/wiki/Boxing_Day_Test"}}]}]}</script>
