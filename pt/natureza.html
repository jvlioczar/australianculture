<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fauna e flora","url":"https://australianculture.biblioverse.org/pt/natureza.html","numberOfItems":69,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Canguru-cinzento","description":"(Mamíferos) O canguru mais visto no leste do país, em parques, campos de golfe e beiras de estrada ao entardecer. Vive em grupos chamados \"mobs\".","sameAs":"https://pt.wikipedia.org/wiki/Macropus_giganteus"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Canguru-vermelho","description":"(Mamíferos) O maior marsupial do mundo: um macho pode passar de 1,8 m. Vive no interior árido e salta a mais de 50 km/h.","sameAs":"https://pt.wikipedia.org/wiki/Canguru-vermelho"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Wallaby","description":"(Mamíferos) Parece um canguru em miniatura. Há dezenas de espécies, como o wallaby-de-pescoço-vermelho, comum na Tasmânia e no leste.","sameAs":"https://pt.wikipedia.org/wiki/Ualabi"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Coala","description":"(Mamíferos) Não é urso: é um marsupial que come quase só folhas de eucalipto e dorme até 20 horas por dia. Está ameaçado em boa parte do leste.","sameAs":"https://pt.wikipedia.org/wiki/Coala"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Vombate (wombat)","description":"(Mamíferos) Marsupial robusto que cava tocas enormes. É o único animal conhecido que faz cocô em formato de cubo.","sameAs":"https://pt.wikipedia.org/wiki/Vombate"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Ornitorrinco","description":"(Mamíferos) Mamífero que bota ovos, tem bico de pato e o macho tem esporão venenoso. Vive em rios do leste e é difícil de ver.","sameAs":"https://pt.wikipedia.org/wiki/Ornitorrinco"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Equidna","description":"(Mamíferos) O outro mamífero que bota ovos. Coberto de espinhos, come formigas e cupins com uma língua comprida.","sameAs":"https://pt.wikipedia.org/wiki/Tachyglossidae"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Quokka","description":"(Mamíferos) O \"animal mais feliz do mundo\", famoso pelas selfies na Rottnest Island, perto de Perth. É proibido tocar ou alimentar.","sameAs":"https://pt.wikipedia.org/wiki/Setonix_brachyurus"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Diabo-da-tasmânia","description":"(Mamíferos) O maior marsupial carnívoro vivo, só existe na Tasmânia. Grita alto e foi a inspiração do Taz, dos Looney Tunes.","sameAs":"https://pt.wikipedia.org/wiki/Diabo-da-tasm%C3%A2nia"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Gambá-de-cauda-escovada (possum)","description":"(Mamíferos) Vive nas cidades, no telhado das casas e nos parques. À noite faz barulho e pode ser visto nas árvores.","sameAs":"https://pt.wikipedia.org/wiki/Trichosurus_vulpecula"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Raposa-voadora","description":"(Mamíferos) Morcego frugívoro gigante, com até 1 m de envergadura. Ao pôr do sol, colônias inteiras cruzam o céu de Sydney e Brisbane.","sameAs":"https://pt.wikipedia.org/wiki/Pteropus"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Dingo","description":"(Mamíferos) Cão selvagem que chegou há cerca de 3.500 a 4.000 anos com povos navegadores. Hoje é considerado parte da fauna nativa.","sameAs":"https://pt.wikipedia.org/wiki/Dingo"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Magpie-australiano","description":"(Aves) Pássaro preto e branco com um canto lindo. Na primavera alguns machos dão rasantes em quem passa perto do ninho: é a \"swooping season\".","sameAs":"https://pt.wikipedia.org/wiki/Gymnorhina_tibicen"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Íbis-branco","description":"(Aves) O \"bin chicken\", que revira lixeiras nas cidades. Na verdade é uma ave de áreas úmidas que se adaptou à vida urbana.","sameAs":"https://pt.wikipedia.org/wiki/%C3%8Dbis-branco-australiano"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Cacatua-de-crista-amarela","description":"(Aves) Barulhenta e muito inteligente. Em Sydney, aprendeu a abrir lixeiras e ensinou a técnica a outras cacatuas.","sameAs":"https://pt.wikipedia.org/wiki/Cacatua-de-crista-amarela"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Galah","description":"(Aves) Cacatua cor-de-rosa e cinza, comum em bandos. \"Galah\" também é gíria para pessoa boba.","sameAs":"https://pt.wikipedia.org/wiki/Galah"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Kookaburra","description":"(Aves) O pássaro cujo canto parece uma gargalhada. É o despertador natural de muitos bairros australianos.","sameAs":"https://pt.wikipedia.org/wiki/Cucaburra-grande"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Lorikeet-arco-íris","description":"(Aves) Pequeno papagaio de todas as cores, que vive em bandos nas árvores floridas das cidades do leste.","sameAs":"https://pt.wikipedia.org/wiki/L%C3%B3ris-molucano"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Emu","description":"(Aves) A segunda ave mais alta do mundo, depois do avestruz. Não voa, mas corre a 50 km/h. Está no brasão nacional.","sameAs":"https://pt.wikipedia.org/wiki/Emu"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Casuar","description":"(Aves) Ave enorme das florestas tropicais do norte de Queensland, com um capacete na cabeça. Importante dispersor de sementes.","sameAs":"https://pt.wikipedia.org/wiki/Casuar-do-sul"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Peru-do-mato (brush turkey)","description":"(Aves) Comum nos quintais de Brisbane e Sydney. O macho constrói montes de folhas que funcionam como chocadeira.","sameAs":"https://pt.wikipedia.org/wiki/Peru-do-mato"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Pelicano-australiano","description":"(Aves) Tem o maior bico entre as aves do mundo. Aparece em praias, rios e lagos de todo o país.","sameAs":"https://pt.wikipedia.org/wiki/Pelicano-australiano"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Pinguim-azul","description":"(Aves) O menor pinguim do mundo, com cerca de 30 cm. Na Phillip Island, perto de Melbourne, desfila ao anoitecer.","sameAs":"https://pt.wikipedia.org/wiki/Pinguim-azul"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Lagarto-de-língua-azul","description":"(Répteis e outros) Lagarto tranquilo dos jardins, que mostra a língua azul quando se assusta. Ajuda a controlar caracóis.","sameAs":"https://en.wikipedia.org/wiki/Blue-tongued_skink"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Goanna","description":"(Répteis e outros) Lagarto-monitor que pode passar de 2 m. Comum em parques nacionais e áreas de piquenique.","sameAs":"https://pt.wikipedia.org/wiki/Goanna"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Crocodilo-de-água-salgada","description":"(Répteis e outros) O maior réptil vivo do mundo, nos rios e no litoral do norte. Respeite as placas: não se nada onde há aviso.","sameAs":"https://pt.wikipedia.org/wiki/Crocodilo-de-%C3%A1gua-salgada"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Aranha caçadora (huntsman)","description":"(Répteis e outros) Grande e assustadora, mas inofensiva para pessoas. Costuma aparecer dentro de carros e casas.","sameAs":"https://pt.wikipedia.org/wiki/Esparass%C3%ADdeos"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Eucalipto","description":"(Plantas e flores) São mais de 700 espécies de \"gum trees\", a árvore que define a paisagem australiana. O cheiro do bush é de eucalipto.","sameAs":"https://pt.wikipedia.org/wiki/Eucalyptus"}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Acácia dourada (golden wattle)","description":"(Plantas e flores) A flor símbolo da Austrália, que inspira o verde e dourado nacionais. Floresce no fim do inverno; 1º de setembro é o Wattle Day.","sameAs":"https://pt.wikipedia.org/wiki/Acacia_pycnantha"}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Banksia","description":"(Plantas e flores) Flores em forma de cone que alimentam aves e marsupiais. Muitas só liberam sementes depois de um incêndio.","sameAs":"https://pt.wikipedia.org/wiki/Banksia"}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","name":"Grevílea","description":"(Plantas e flores) Arbustos de flores curvas e coloridas, cheias de néctar. Presentes em quase todo jardim australiano.","sameAs":"https://pt.wikipedia.org/wiki/Grevillea"}},{"@type":"ListItem","position":32,"item":{"@type":"Thing","name":"Waratah","description":"(Plantas e flores) A flor vermelha e enorme que é o emblema de New South Wales.","sameAs":"https://en.wikipedia.org/wiki/Telopea_speciosissima"}},{"@type":"ListItem","position":33,"item":{"@type":"Thing","name":"Kangaroo paw","description":"(Plantas e flores) Flor em forma de pata de canguru, emblema de Western Australia.","sameAs":"https://pt.wikipedia.org/wiki/Anigozanthos"}},{"@type":"ListItem","position":34,"item":{"@type":"Thing","name":"Escova-de-garrafa (bottlebrush)","description":"(Plantas e flores) Flores vermelhas que parecem escovas de lavar garrafa. Atraem lorikeets e abelhas.","sameAs":"https://pt.wikipedia.org/wiki/Callistemon"}},{"@type":"ListItem","position":35,"item":{"@type":"Thing","name":"Melaleuca (paperbark)","description":"(Plantas e flores) Árvore de casca que solta como papel. Uma espécie dá o óleo de tea tree, usado em cosméticos.","sameAs":"https://pt.wikipedia.org/wiki/Melaleuca"}},{"@type":"ListItem","position":36,"item":{"@type":"Thing","name":"Grass tree","description":"(Plantas e flores) Planta de tronco escuro e tufo de folhas finas, que cresce cerca de 1 cm por ano. Algumas têm centenas de anos.","sameAs":"https://pt.wikipedia.org/wiki/Xanthorrhoeoideae"}},{"@type":"ListItem","position":37,"item":{"@type":"Thing","name":"Boab","description":"(Plantas e flores) O baobá australiano, de tronco gordo como uma garrafa, típico da região de Kimberley.","sameAs":"https://pt.wikipedia.org/wiki/Adansonia_gregorii"}},{"@type":"ListItem","position":38,"item":{"@type":"Thing","name":"Figueira-de-Moreton-Bay","description":"(Plantas e flores) Figueira gigante de raízes aéreas, comum em parques de Sydney e Brisbane. Sombra garantida.","sameAs":"https://pt.wikipedia.org/wiki/Ficus_macrophylla"}},{"@type":"ListItem","position":39,"item":{"@type":"Thing","name":"Pinheiro-de-Wollemi","description":"(Plantas e flores) Árvore da época dos dinossauros, conhecida por fósseis, encontrada viva em 1994 num cânion perto de Sydney.","sameAs":"https://pt.wikipedia.org/wiki/Wollemia"}},{"@type":"ListItem","position":40,"item":{"@type":"Thing","name":"Spinifex","description":"(Plantas e flores) Capim espinhoso que cobre boa parte do outback e segura a areia vermelha do deserto.","sameAs":"https://pt.wikipedia.org/wiki/Triodia"}},{"@type":"ListItem","position":41,"item":{"@type":"Thing","name":"Macadâmia","description":"(Plantas e flores) Árvore nativa de Queensland e NSW. A noz australiana mais famosa do mundo.","sameAs":"https://pt.wikipedia.org/wiki/Macadamia"}},{"@type":"ListItem","position":42,"item":{"@type":"Thing","name":"Bilby","description":"(Mamíferos) Marsupial do deserto de orelhas compridas. Na Páscoa, muitos australianos trocam o coelho de chocolate pelo bilby de chocolate.","sameAs":"https://pt.wikipedia.org/wiki/Macrotis_lagotis"}},{"@type":"ListItem","position":43,"item":{"@type":"Thing","name":"Petauro-do-açúcar (sugar glider)","description":"(Mamíferos) Pequeno gambá noturno que plana de árvore em árvore com uma membrana entre as patas.","sameAs":"https://pt.wikipedia.org/wiki/Petaurus_breviceps"}},{"@type":"ListItem","position":44,"item":{"@type":"Thing","name":"Numbat","description":"(Mamíferos) Marsupial listrado que come milhares de cupins por dia. Emblema de Western Australia e ameaçado de extinção.","sameAs":"https://pt.wikipedia.org/wiki/Mirmec%C3%B3bio"}},{"@type":"ListItem","position":45,"item":{"@type":"Thing","name":"Canguru-arborícola","description":"(Mamíferos) Sim, existe canguru que vive em árvore. O de Lumholtz mora nas florestas tropicais do norte de Queensland.","sameAs":"https://pt.wikipedia.org/wiki/Dendrolagus"}},{"@type":"ListItem","position":46,"item":{"@type":"Thing","name":"Corruíra-azul (superb fairywren)","description":"(Aves) Passarinho minúsculo; na época de reprodução o macho fica azul-elétrico. Comum em jardins e parques.","sameAs":"https://pt.wikipedia.org/wiki/Malurus_cyaneus"}},{"@type":"ListItem","position":47,"item":{"@type":"Thing","name":"Cisne-negro","description":"(Aves) Na Europa se achava que cisne negro não existia, até ver os da Austrália. É o emblema de Western Australia.","sameAs":"https://pt.wikipedia.org/wiki/Cisne-negro"}},{"@type":"ListItem","position":48,"item":{"@type":"Thing","name":"Willie wagtail","description":"(Aves) Pequeno, preto e branco e sem medo de gente. Abana o rabo de um lado para o outro o tempo todo.","sameAs":"https://pt.wikipedia.org/wiki/Rhipidura_leucophrys"}},{"@type":"ListItem","position":49,"item":{"@type":"Thing","name":"Tawny frogmouth","description":"(Aves) Parece uma coruja, mas não é. De dia fica imóvel num galho e se disfarça de pedaço de árvore.","sameAs":"https://pt.wikipedia.org/wiki/Boca-de-sapo-australiano"}},{"@type":"ListItem","position":50,"item":{"@type":"Thing","name":"Pássaro-lira (lyrebird)","description":"(Aves) O maior imitador do mundo das aves: reproduz outros pássaros, motosserras e cliques de câmera. Está na moeda de 10 centavos.","sameAs":"https://pt.wikipedia.org/wiki/Ave-lira-soberba"}},{"@type":"ListItem","position":51,"item":{"@type":"Thing","name":"Águia-de-cauda-em-cunha","description":"(Aves) A maior ave de rapina da Austrália, planando alto sobre o outback.","sameAs":"https://pt.wikipedia.org/wiki/%C3%81guia-audaz"}},{"@type":"ListItem","position":52,"item":{"@type":"Thing","name":"Rosela-carmesim","description":"(Aves) Papagaio vermelho e azul das florestas do leste, frequentador de piqueniques nas montanhas.","sameAs":"https://pt.wikipedia.org/wiki/Rosela-elegante"}},{"@type":"ListItem","position":53,"item":{"@type":"Thing","name":"Lagarto-de-gola (frill-necked lizard)","description":"(Répteis e outros) Abre uma gola enorme em volta da cabeça para assustar quem chega perto. Já estampou a moeda de 2 centavos.","sameAs":"https://pt.wikipedia.org/wiki/Lagarto-de-gola"}},{"@type":"ListItem","position":54,"item":{"@type":"Thing","name":"Perereca-verde","description":"(Répteis e outros) Perereca gordinha e sorridente que adora aparecer em banheiros e caixas-d'água de Queensland.","sameAs":"https://pt.wikipedia.org/wiki/R%C3%A3-arbor%C3%ADcola-de-white"}},{"@type":"ListItem","position":55,"item":{"@type":"Thing","name":"Diabo-espinhoso (thorny devil)","description":"(Répteis e outros) Lagarto do deserto coberto de espinhos que bebe água pela pele, por canaletas que levam a gota até a boca.","sameAs":"https://pt.wikipedia.org/wiki/Diabo-espinhoso"}},{"@type":"ListItem","position":56,"item":{"@type":"Thing","name":"Baleia-jubarte","description":"(Vida marinha) Entre maio e novembro, dezenas de milhares migram pelas costas leste e oeste. Dá para vê-las da praia.","sameAs":"https://pt.wikipedia.org/wiki/Baleia-jubarte"}},{"@type":"ListItem","position":57,"item":{"@type":"Thing","name":"Tartaruga-verde","description":"(Vida marinha) Desova nas praias da Grande Barreira de Corais. Os filhotes correm para o mar à noite.","sameAs":"https://pt.wikipedia.org/wiki/Tartaruga-verde"}},{"@type":"ListItem","position":58,"item":{"@type":"Thing","name":"Dugongo","description":"(Vida marinha) A \"vaca-marinha\" que pasta capim no fundo do mar, em lugares como Moreton Bay e Shark Bay.","sameAs":"https://pt.wikipedia.org/wiki/Dugongo"}},{"@type":"ListItem","position":59,"item":{"@type":"Thing","name":"Dragão-marinho-folhado","description":"(Vida marinha) Parente do cavalo-marinho que parece uma alga flutuando. Emblema marinho de South Australia.","sameAs":"https://pt.wikipedia.org/wiki/Drag%C3%A3o-marinho-folhado"}},{"@type":"ListItem","position":60,"item":{"@type":"Thing","name":"Ervilha-do-deserto de Sturt","description":"(Plantas e flores) Flor vermelha com o centro preto e brilhante, que pinta o deserto. Emblema de South Australia.","sameAs":"https://en.wikipedia.org/wiki/Swainsona_formosa"}},{"@type":"ListItem","position":61,"item":{"@type":"Thing","name":"Orquídea de Cooktown","description":"(Plantas e flores) Orquídea roxa das florestas do norte, emblema de Queensland.","sameAs":"https://en.wikipedia.org/wiki/Dendrobium_bigibbum"}},{"@type":"ListItem","position":62,"item":{"@type":"Thing","name":"Urze-comum (common heath)","description":"(Plantas e flores) Arbusto de flores em sininho, rosas ou brancas. Emblema de Victoria.","sameAs":"https://en.wikipedia.org/wiki/Epacris_impressa"}},{"@type":"ListItem","position":63,"item":{"@type":"Thing","name":"Rosa-do-deserto de Sturt","description":"(Plantas e flores) Flor lilás das regiões áridas, emblema do Northern Territory.","sameAs":"https://en.wikipedia.org/wiki/Gossypium_sturtianum"}},{"@type":"ListItem","position":64,"item":{"@type":"Thing","name":"Eucalipto-azul da Tasmânia","description":"(Plantas e flores) Árvore alta de folhas azuladas, emblema da Tasmânia e uma das mais plantadas no mundo.","sameAs":"https://pt.wikipedia.org/wiki/Eucalyptus_globulus"}},{"@type":"ListItem","position":65,"item":{"@type":"Thing","name":"Campânula-real (royal bluebell)","description":"(Plantas e flores) Florzinha azul das campinas, emblema do Território da Capital (ACT).","sameAs":"https://en.wikipedia.org/wiki/Wahlenbergia_gloriosa"}},{"@type":"ListItem","position":66,"item":{"@type":"Thing","name":"Eucalipto-vermelho-dos-rios (river red gum)","description":"(Plantas e flores) O eucalipto gigante que acompanha os rios do interior. Pode viver mais de 500 anos.","sameAs":"https://pt.wikipedia.org/wiki/Eucalyptus_camaldulensis"}},{"@type":"ListItem","position":67,"item":{"@type":"Thing","name":"Samambaia-arbórea","description":"(Plantas e flores) Samambaias com tronco de vários metros, típicas das florestas frias do sudeste e da Tasmânia.","sameAs":"https://pt.wikipedia.org/wiki/Dicksonia_antarctica"}},{"@type":"ListItem","position":68,"item":{"@type":"Thing","name":"Lilly pilly","description":"(Plantas e flores) Árvore de frutinhas cor-de-rosa comestíveis, muito usada como cerca viva nos quintais.","sameAs":"https://pt.wikipedia.org/wiki/Syzygium"}},{"@type":"ListItem","position":69,"item":{"@type":"Thing","name":"Árvore-garrafa de Queensland","description":"(Plantas e flores) Tronco gordo em forma de garrafa, onde a árvore guarda água para a seca.","sameAs":"https://pt.wikipedia.org/wiki/%C3%81rvore-garrafa-de-queensland"}}]}]}</script>
