<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Lugares","url":"https://australianculture.biblioverse.org/pt/lugares.html","numberOfItems":58,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"TouristAttraction","name":"Bondi Beach","description":"A praia mais famosa do país, a 7 km do centro de Sydney. Tem a piscina oceânica Icebergs, os salva-vidas do programa Bondi Rescue e a trilha costeira de 6 km até Coogee.","sameAs":"https://pt.wikipedia.org/wiki/Praia_de_Bondi"}},{"@type":"ListItem","position":2,"item":{"@type":"TouristAttraction","name":"Whitehaven Beach","description":"Sete quilômetros de areia de sílica quase pura nas ilhas Whitsunday. Do mirante de Hill Inlet, a maré desenha redemoinhos de areia e água turquesa.","sameAs":"https://en.wikipedia.org/wiki/Whitehaven_Beach"}},{"@type":"ListItem","position":3,"item":{"@type":"TouristAttraction","name":"Manly Beach","description":"A meia hora de balsa de Circular Quay, passando pela Opera House. Praia de surfe com o calçadão do Corso e clima de cidade praiana.","sameAs":"https://en.wikipedia.org/wiki/Manly_Beach"}},{"@type":"ListItem","position":4,"item":{"@type":"TouristAttraction","name":"Bells Beach","description":"Onda lendária perto de Torquay, no início da Great Ocean Road. Recebe todo ano na Páscoa o Rip Curl Pro, um dos campeonatos de surfe mais tradicionais do mundo.","sameAs":"https://pt.wikipedia.org/wiki/Bells_Beach"}},{"@type":"ListItem","position":5,"item":{"@type":"TouristAttraction","name":"Byron Bay","description":"Cidade de surfe e estilo de vida alternativo. O farol do Cape Byron marca o ponto mais a leste do continente australiano.","sameAs":"https://pt.wikipedia.org/wiki/Byron_Bay"}},{"@type":"ListItem","position":6,"item":{"@type":"TouristAttraction","name":"Cable Beach","description":"São 22 km de areia branca em Broome, no noroeste. O pôr do sol sobre o Oceano Índico é o grande espetáculo do dia.","sameAs":"https://en.wikipedia.org/wiki/Cable_Beach"}},{"@type":"ListItem","position":7,"item":{"@type":"TouristAttraction","name":"Cottesloe Beach","description":"A praia de Perth, com águas calmas e pôr do sol no mar. Todo ano recebe a exposição de esculturas ao ar livre Sculpture by the Sea.","sameAs":"https://en.wikipedia.org/wiki/Cottesloe_Beach"}},{"@type":"ListItem","position":8,"item":{"@type":"TouristAttraction","name":"Hyams Beach","description":"Na baía de Jervis, ao sul de Sydney, é famosa pela areia branquíssima e pela água transparente.","sameAs":"https://en.wikipedia.org/wiki/Hyams_Beach"}},{"@type":"ListItem","position":9,"item":{"@type":"TouristAttraction","name":"Wineglass Bay","description":"A baía em forma de taça no Parque Nacional Freycinet. A trilha até o mirante é uma das caminhadas mais fotografadas da Tasmânia.","sameAs":"https://en.wikipedia.org/wiki/Freycinet_National_Park"}},{"@type":"ListItem","position":10,"item":{"@type":"TouristAttraction","name":"Surfers Paradise","description":"O coração da Gold Coast: arranha-céus colados na areia, ondas o ano inteiro e vida noturna agitada.","sameAs":"https://pt.wikipedia.org/wiki/Surfers_Paradise"}},{"@type":"ListItem","position":11,"item":{"@type":"TouristAttraction","name":"Rottnest Island","description":"Wadjemup para os Noongar. Ilha sem carros a 18 km de Fremantle, rodada de bicicleta entre enseadas de água transparente. É a casa dos quokkas, famosos pelas selfies em que parecem sorrir.","sameAs":"https://en.wikipedia.org/wiki/Rottnest_Island"}},{"@type":"ListItem","position":12,"item":{"@type":"TouristAttraction","name":"Uluṟu-Kata Tjuṯa","description":"O parque dos Anangu, donos tradicionais da terra. Uluru tem 348 m de altura e a escalada é proibida desde 2019 em respeito a eles; ao lado, Kata Tjuta reúne 36 domos de rocha.","sameAs":"https://pt.wikipedia.org/wiki/Parque_Nacional_Uluru-Kata_Tjuta"}},{"@type":"ListItem","position":13,"item":{"@type":"TouristAttraction","name":"Kakadu","description":"O segundo maior parque nacional do país (depois do Munga-Thirri–Simpson Desert), Patrimônio Mundial natural e cultural. Em Ubirr e Burrungkuy há pinturas rupestres aborígenes com milhares de anos.","sameAs":"https://pt.wikipedia.org/wiki/Parque_Nacional_de_Kakadu"}},{"@type":"ListItem","position":14,"item":{"@type":"TouristAttraction","name":"Blue Mountains","description":"A duas horas de Sydney, com as rochas das Three Sisters e a névoa azulada que sobe dos eucaliptos. Patrimônio Mundial desde 2000.","sameAs":"https://pt.wikipedia.org/wiki/Montanhas_Azuis_(Austr%C3%A1lia)"}},{"@type":"ListItem","position":15,"item":{"@type":"TouristAttraction","name":"Floresta de Daintree","description":"Uma das florestas tropicais mais antigas do mundo. Em Cape Tribulation, a mata encontra o mar e a Grande Barreira de Corais.","sameAs":"https://en.wikipedia.org/wiki/Daintree_Rainforest"}},{"@type":"ListItem","position":16,"item":{"@type":"TouristAttraction","name":"Royal National Park","description":"Criado em 1879, é o segundo parque nacional mais antigo do mundo, depois de Yellowstone. Fica no limite sul de Sydney, com trilhas no penhasco e piscinas naturais.","sameAs":"https://en.wikipedia.org/wiki/Royal_National_Park"}},{"@type":"ListItem","position":17,"item":{"@type":"TouristAttraction","name":"Cradle Mountain","description":"Montanha de picos recortados sobre o lago Dove. É o início da Overland Track, travessia de 65 km pela natureza selvagem da Tasmânia.","sameAs":"https://pt.wikipedia.org/wiki/Parque_Nacional_Cradle_Mountain-Lake_St._Clair"}},{"@type":"ListItem","position":18,"item":{"@type":"TouristAttraction","name":"Gariwerd (Grampians)","description":"Serras de arenito no oeste de Victoria, com mirantes como o Pinnacle e o Balconies e muitos sítios de arte rupestre aborígene.","sameAs":"https://en.wikipedia.org/wiki/Grampians_National_Park"}},{"@type":"ListItem","position":19,"item":{"@type":"TouristAttraction","name":"Karijini","description":"Gargantas vermelhas profundas no Pilbara, com piscinas naturais e cachoeiras escondidas entre paredões de rocha de bilhões de anos.","sameAs":"https://en.wikipedia.org/wiki/Karijini_National_Park"}},{"@type":"ListItem","position":20,"item":{"@type":"TouristAttraction","name":"Kings Park","description":"Um dos maiores parques urbanos do mundo, maior que o Central Park de Nova York, com vista para o centro de Perth e o rio Swan.","sameAs":"https://en.wikipedia.org/wiki/Kings_Park,_Western_Australia"}},{"@type":"ListItem","position":21,"item":{"@type":"TouristAttraction","name":"Royal Botanic Garden Sydney","description":"Aberto em 1816 ao lado da Opera House. Da cadeira de Mrs Macquarie se vê a ponte e a ópera na mesma foto.","sameAs":"https://pt.wikipedia.org/wiki/Royal_Botanic_Garden_(Sydney)"}},{"@type":"ListItem","position":22,"item":{"@type":"TouristAttraction","name":"South Bank e Streets Beach","description":"O parque à beira do rio Brisbane, no terreno da Expo 88, tem a Streets Beach: uma praia artificial com areia e lagoa no meio da cidade, de graça e com salva-vidas. Do outro lado do rio fica o Queen’s Wharf, o complexo com o cassino The Star, hotéis e restaurantes.","sameAs":"https://en.wikipedia.org/wiki/South_Bank_Parklands"}},{"@type":"ListItem","position":23,"item":{"@type":"TouristAttraction","name":"Grande Barreira de Corais","description":"O maior sistema de recifes de coral do mundo, com cerca de 2.300 km. Patrimônio Mundial desde 1981 e visível do espaço.","sameAs":"https://pt.wikipedia.org/wiki/Grande_Barreira_de_Coral"}},{"@type":"ListItem","position":24,"item":{"@type":"TouristAttraction","name":"Doze Apóstolos","description":"Colunas de calcário que saem do mar ao longo da Great Ocean Road. Apesar do nome, hoje restam só sete de pé: a erosão vai derrubando uma a uma.","sameAs":"https://en.wikipedia.org/wiki/The_Twelve_Apostles_(Victoria)"}},{"@type":"ListItem","position":25,"item":{"@type":"TouristAttraction","name":"K’gari","description":"A maior ilha de areia do mundo, antes chamada Fraser Island. Em 2023 voltou oficialmente ao nome dado pelos Butchulla, que significa “paraíso”.","sameAs":"https://pt.wikipedia.org/wiki/Ilha_Fraser"}},{"@type":"ListItem","position":26,"item":{"@type":"TouristAttraction","name":"Pinnacles","description":"Milhares de pilares de calcário espalhados pela areia amarela do Parque Nacional Nambung, ao norte de Perth. Parece outro planeta.","sameAs":"https://pt.wikipedia.org/wiki/Deserto_dos_Pin%C3%A1culos"}},{"@type":"ListItem","position":27,"item":{"@type":"TouristAttraction","name":"Lago Hillier","description":"Um lago cor-de-rosa na Middle Island, no arquipélago de Recherche. A cor vem de algas e bactérias que vivem na água salgada.","sameAs":"https://pt.wikipedia.org/wiki/Lago_Hillier"}},{"@type":"ListItem","position":28,"item":{"@type":"TouristAttraction","name":"Wave Rock","description":"Uma parede de granito de 15 m de altura com o formato de uma onda prestes a quebrar, perto da cidadezinha de Hyden.","sameAs":"https://pt.wikipedia.org/wiki/Wave_Rock"}},{"@type":"ListItem","position":29,"item":{"@type":"TouristAttraction","name":"Purnululu (Bungle Bungle)","description":"Domos de arenito com listras laranja e pretas, no Kimberley. O mundo de fora só os conheceu nos anos 1980; hoje são Patrimônio Mundial.","sameAs":"https://pt.wikipedia.org/wiki/Parque_Nacional_Purnululu"}},{"@type":"ListItem","position":30,"item":{"@type":"TouristAttraction","name":"Ikara (Wilpena Pound)","description":"Um imenso anfiteatro natural de montanhas nas Flinders Ranges, lugar sagrado para os Adnyamathanha.","sameAs":"https://en.wikipedia.org/wiki/Wilpena_Pound"}},{"@type":"ListItem","position":31,"item":{"@type":"TouristAttraction","name":"Ilhas Whitsunday","description":"Setenta e quatro ilhas no meio da Grande Barreira de Corais, para velejar, mergulhar e visitar a praia de Whitehaven.","sameAs":"https://pt.wikipedia.org/wiki/Ilhas_Whitsunday"}},{"@type":"ListItem","position":32,"item":{"@type":"TouristAttraction","name":"Sydney Opera House","description":"Inaugurada em 1973, com as velas projetadas pelo arquiteto dinamarquês Jørn Utzon. Patrimônio Mundial desde 2007 e o símbolo do país.","sameAs":"https://pt.wikipedia.org/wiki/%C3%93pera_de_Sydney"}},{"@type":"ListItem","position":33,"item":{"@type":"TouristAttraction","name":"Parliament House","description":"O parlamento de Canberra, inaugurado em 1988, foi construído dentro de uma colina e tem teto de grama por onde se pode caminhar. No alto, um mastro de 81 m.","sameAs":"https://pt.wikipedia.org/wiki/Casa_do_Parlamento_da_Austr%C3%A1lia"}},{"@type":"ListItem","position":34,"item":{"@type":"TouristAttraction","name":"Flinders Street Station","description":"A estação amarela de 1910 é o cartão-postal de Melbourne. “Te encontro embaixo dos relógios” é o ponto de encontro clássico da cidade.","sameAs":"https://pt.wikipedia.org/wiki/Flinders_Street_Station"}},{"@type":"ListItem","position":35,"item":{"@type":"TouristAttraction","name":"Royal Exhibition Building","description":"Palácio de exposições de 1880 em Melbourne, onde o primeiro parlamento federal se reuniu em 1901. Patrimônio Mundial desde 2004.","sameAs":"https://pt.wikipedia.org/wiki/Edif%C3%ADcio_da_Exposi%C3%A7%C3%A3o_Real"}},{"@type":"ListItem","position":36,"item":{"@type":"TouristAttraction","name":"Queen Victoria Building","description":"Galeria de compras de 1898 no centro de Sydney, com cúpulas, vitrais e relógios mecânicos. Quase foi demolida nos anos 1950.","sameAs":"https://en.wikipedia.org/wiki/Queen_Victoria_Building"}},{"@type":"ListItem","position":37,"item":{"@type":"TouristAttraction","name":"Federation Square","description":"Praça cultural de 2002 em frente à Flinders Street, com fachadas geométricas, museus e telão para grandes eventos.","sameAs":"https://pt.wikipedia.org/wiki/Federation_Square"}},{"@type":"ListItem","position":38,"item":{"@type":"TouristAttraction","name":"Sydney Tower Eye","description":"A torre de 309 m é a estrutura mais alta de Sydney desde 1981. Do deck se vê do oceano às Blue Mountains.","sameAs":"https://pt.wikipedia.org/wiki/Torre_de_Sydney"}},{"@type":"ListItem","position":39,"item":{"@type":"TouristAttraction","name":"Q1","description":"Torre residencial de 322 m em Surfers Paradise, com o observatório SkyPoint no topo e vista de toda a Gold Coast.","sameAs":"https://pt.wikipedia.org/wiki/Q1_(edif%C3%ADcio)"}},{"@type":"ListItem","position":40,"item":{"@type":"TouristAttraction","name":"MONA","description":"O Museu de Arte Antiga e Nova de Hobart, aberto em 2011 e escavado na rocha à beira do rio Derwent. Provocador de propósito.","sameAs":"https://en.wikipedia.org/wiki/Museum_of_Old_and_New_Art"}},{"@type":"ListItem","position":41,"item":{"@type":"TouristAttraction","name":"Sydney Harbour Bridge","description":"O “Coathanger” (cabide), de 1932, é um dos maiores arcos de aço do mundo. Dá para subir no arco com o BridgeClimb, a 134 m da água, e o réveillon explode em fogos sobre ela.","sameAs":"https://pt.wikipedia.org/wiki/Ponte_da_Ba%C3%ADa_de_Sydney"}},{"@type":"ListItem","position":42,"item":{"@type":"TouristAttraction","name":"Story Bridge","description":"Ponte de aço de 1940 sobre o rio Brisbane, o cartão-postal da cidade. Também tem escalada guiada.","sameAs":"https://en.wikipedia.org/wiki/Story_Bridge"}},{"@type":"ListItem","position":43,"item":{"@type":"TouristAttraction","name":"West Gate Bridge","description":"A ponte que cruza o rio Yarra em Melbourne. Durante a construção, em 1970, um vão desabou e matou 35 trabalhadores, a pior tragédia industrial do país.","sameAs":"https://en.wikipedia.org/wiki/West_Gate_Bridge"}},{"@type":"ListItem","position":44,"item":{"@type":"TouristAttraction","name":"Anzac Bridge","description":"Ponte estaiada de 1995 em Sydney, com estátuas de um soldado australiano e de um neozelandês em homenagem aos Anzacs.","sameAs":"https://en.wikipedia.org/wiki/Anzac_Bridge"}},{"@type":"ListItem","position":45,"item":{"@type":"TouristAttraction","name":"Sea Cliff Bridge","description":"Uma ponte que contorna o penhasco por cima do mar, na Grand Pacific Drive, perto de Wollongong. Cenário de comercial de carro.","sameAs":"https://en.wikipedia.org/wiki/Sea_Cliff_Bridge"}},{"@type":"ListItem","position":46,"item":{"@type":"TouristAttraction","name":"Richmond Bridge","description":"Construída por condenados em 1823, é a ponte de pedra mais antiga da Austrália ainda em uso.","sameAs":"https://en.wikipedia.org/wiki/Richmond_Bridge_(Tasmania)"}},{"@type":"ListItem","position":47,"item":{"@type":"TouristAttraction","name":"Kurilpa Bridge","description":"Passarela de 2009 em Brisbane com mastros e cabos em ângulos malucos. É a maior ponte do tipo tensegridade do mundo.","sameAs":"https://en.wikipedia.org/wiki/Kurilpa_Bridge"}},{"@type":"ListItem","position":48,"item":{"@type":"TouristAttraction","name":"Tasman Bridge","description":"Liga as duas margens de Hobart. Em 1975 um navio bateu nos pilares e derrubou parte da ponte, deixando a cidade dividida por quase dois anos.","sameAs":"https://pt.wikipedia.org/wiki/Ponte_Tasman"}},{"@type":"ListItem","position":49,"item":{"@type":"TouristAttraction","name":"Australian War Memorial","description":"Memorial e museu de Canberra, aberto em 1941. Todo fim de tarde a cerimônia do Last Post conta a história de um dos nomes do Muro de Honra.","sameAs":"https://pt.wikipedia.org/wiki/Memorial_de_Guerra_Australiano"}},{"@type":"ListItem","position":50,"item":{"@type":"TouristAttraction","name":"Shrine of Remembrance","description":"Memorial de guerra de 1934 em Melbourne. Às 11h do dia 11 de novembro, um raio de sol entra por uma abertura no teto e ilumina a palavra “Love” na Pedra da Lembrança.","sameAs":"https://pt.wikipedia.org/wiki/Santu%C3%A1rio_da_Lembran%C3%A7a"}},{"@type":"ListItem","position":51,"item":{"@type":"TouristAttraction","name":"Great Ocean Road","description":"Os 243 km de estrada à beira-mar foram construídos por soldados que voltaram da Primeira Guerra. É o maior memorial de guerra do mundo.","sameAs":"https://pt.wikipedia.org/wiki/Great_Ocean_Road"}},{"@type":"ListItem","position":52,"item":{"@type":"TouristAttraction","name":"Embaixada Aborígene da Tenda","description":"Montada em 1972 diante do antigo parlamento para reivindicar direitos à terra. É um dos protestos permanentes mais antigos do mundo.","sameAs":"https://pt.wikipedia.org/wiki/Embaixada_Abor%C3%ADgene"}},{"@type":"ListItem","position":53,"item":{"@type":"TouristAttraction","name":"Port Arthur","description":"Antiga colônia penal de 1830, hoje sítio histórico. Faz parte dos Sítios de Condenados da Austrália, Patrimônio Mundial.","sameAs":"https://pt.wikipedia.org/wiki/Port_Arthur_(Tasm%C3%A2nia)"}},{"@type":"ListItem","position":54,"item":{"@type":"TouristAttraction","name":"Fremantle Prison","description":"Prisão construída por condenados nos anos 1850 e usada até 1991. Também integra os Sítios de Condenados, Patrimônio Mundial.","sameAs":"https://en.wikipedia.org/wiki/Fremantle_Prison"}},{"@type":"ListItem","position":55,"item":{"@type":"TouristAttraction","name":"Old Parliament House","description":"O parlamento de 1927 a 1988, em Canberra. Hoje abriga o Museu da Democracia Australiana.","sameAs":"https://en.wikipedia.org/wiki/Old_Parliament_House,_Canberra"}},{"@type":"ListItem","position":56,"item":{"@type":"TouristAttraction","name":"Big Banana","description":"A banana gigante de Coffs Harbour, de 1964, inaugurou a mania das “Big Things”: hoje são mais de 150 esculturas gigantes espalhadas pelas estradas do país.","sameAs":"https://pt.wikipedia.org/wiki/Big_Banana"}},{"@type":"ListItem","position":57,"item":{"@type":"TouristAttraction","name":"Big Pineapple","description":"Um abacaxi de 16 m na Sunshine Coast, aberto em 1971. Já recebeu até a visita do príncipe Charles e da princesa Diana.","sameAs":"https://en.wikipedia.org/wiki/Big_Pineapple"}},{"@type":"ListItem","position":58,"item":{"@type":"TouristAttraction","name":"Golden Guitar","description":"Violão dourado de 12 m em Tamworth, a capital da música country australiana, onde acontece todo janeiro o Tamworth Country Music Festival.","sameAs":"https://en.wikipedia.org/wiki/Big_Golden_Guitar"}}]}]}</script>
