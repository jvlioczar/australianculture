<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fatos históricos","url":"https://australianculture.biblioverse.org/pt/historia.html","numberOfItems":30,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Os primeiros povos","description":"(Povos originários · 65–50 mil a.C.) Os ancestrais dos aborígenes chegam ao continente. Nasce a cultura viva contínua mais antiga da Terra, com centenas de nações e línguas."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Os holandeses","description":"(Colonização · 1606) Willem Janszoon, no navio Duyfken, é o primeiro europeu registrado a pisar na Austrália, no Cabo York."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"James Cook","description":"(Colonização · 1770) O capitão britânico mapeia a costa leste, desembarca em Botany Bay e reivindica a terra para a Coroa."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"A Primeira Frota","description":"(Colonização · 26/01/1788) 11 navios com cerca de 1.400 pessoas, metade condenados, fundam a colônia penal de Sydney Cove. A data é o Australia Day, que muitos indígenas chamam de Invasion Day."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Colônia de condenados","description":"(Colonização · 1788–1868) Cerca de 162 mil condenados são enviados do Reino Unido. O último navio chega em 1868, a Western Australia."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Corrida do ouro","description":"(Nação · 1851) O ouro em NSW e Victoria multiplica a população e enriquece Melbourne, que vira uma das cidades mais ricas do mundo."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Eureka Stockade","description":"(Nação · 1854) Mineiros de Ballarat se rebelam contra o governo colonial. A revolta é vista como o berço da democracia australiana."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Ned Kelly","description":"(Nação · 1880) O fora da lei de armadura de ferro é enforcado em Melbourne e vira lenda nacional."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Federação","description":"(Nação · 01/01/1901) As seis colônias se unem e formam a Commonwealth of Australia. No mesmo ano começa a política da \"Austrália Branca\"."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Voto das mulheres","description":"(Nação · 1902) As mulheres (não indígenas) ganham o direito de votar e de se candidatar em eleições federais."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Gallipoli","description":"(Guerras · 25/04/1915) As tropas do ANZAC desembarcam na Turquia. A derrota vira mito fundador; o 25 de abril é o Anzac Day."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Harbour Bridge","description":"(Nação · 1932) A ponte de Sydney é inaugurada. No mesmo ano acontece a Guerra dos Emus."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Darwin bombardeada","description":"(Guerras · 1942) Na Segunda Guerra, o Japão ataca Darwin, o maior ataque estrangeiro em solo australiano."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"\"Populate or perish\"","description":"(Sociedade · 1945) Começa a imigração em massa do pós-guerra, com britânicos, italianos, gregos e outros europeus. Mais de 7 milhões chegariam nas décadas seguintes."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Olimpíadas de Melbourne","description":"(Sociedade · 1956) Os primeiros Jogos do hemisfério sul. No mesmo ano chega a televisão."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Nasce o dólar","description":"(Sociedade · 1966) A moeda decimal substitui a libra australiana."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Referendo histórico","description":"(Povos originários · 1967) 90,77% votam para que os aborígenes sejam contados no censo e cobertos pelas leis federais."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Fim da Austrália Branca","description":"(Sociedade · 1973) O governo Whitlam abandona de vez a política racial de imigração. A Opera House é inaugurada."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"A demissão","description":"(Nação · 1975) O governador-geral demite o primeiro-ministro Gough Whitlam, a maior crise constitucional do país."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"America's Cup","description":"(Sociedade · 1983) O iate Australia II quebra 132 anos de domínio americano na regata. O premiê Bob Hawke diz que patrão que demitir quem faltar ao trabalho naquele dia \"é um vagabundo\"."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Australia Act","description":"(Nação · 1986) Cortam-se os últimos laços legais com o Parlamento britânico."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Decisão Mabo","description":"(Povos originários · 1992) A Suprema Corte derruba a ideia de \"terra nullius\" (terra de ninguém) e reconhece o título nativo das terras."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Port Arthur e as armas","description":"(Sociedade · 1996) Após o massacre de 35 pessoas na Tasmânia, o país aprova um rígido controle de armas, com recompra de 650 mil armas."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Referendo da república","description":"(Nação · 1999) Os eleitores rejeitam trocar a monarquia por uma república. O rei britânico segue chefe de Estado."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Olimpíadas de Sydney","description":"(Sociedade · 2000) Cathy Freeman, atleta aborígene, acende a pira e vence os 400 m."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"O pedido de desculpas","description":"(Povos originários · 2008) O premiê Kevin Rudd pede perdão às Gerações Roubadas, crianças indígenas tiradas das famílias."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Casamento igualitário","description":"(Sociedade · 2017) Depois de uma consulta postal com 61,6% de \"sim\", o casamento entre pessoas do mesmo sexo é aprovado."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Black Summer","description":"(Sociedade · 2019–20) Incêndios florestais queimam mais de 24 milhões de hectares e matam cerca de 3 bilhões de animais."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Matildas e o Voice","description":"(Povos originários · 2023) A seleção feminina chega à semifinal da Copa em casa e para o país. Em outubro, o referendo do Voice indígena no Parlamento é rejeitado."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Brisbane Olímpica","description":"(Sociedade · 2032) Brisbane será a terceira cidade australiana a sediar os Jogos Olímpicos."}}]}]}</script>
