<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://australianculture.biblioverse.org/key-dates.html#page","url":"https://australianculture.biblioverse.org/key-dates.html","name":"Key dates — Australian Culture","description":"Australia’s public holidays and key dates, from Australia Day to Anzac Day and NAIDOC Week, with First Nations views where a date is contested.","inLanguage":"en-AU","isPartOf":{"@id":"https://australianculture.biblioverse.org/#website"},"primaryImageOfPage":"https://australianculture.biblioverse.org/images/share-18-en-3.png","dateModified":"2026-11-01","breadcrumb":{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Australian Culture","item":"https://australianculture.biblioverse.org/"},{"@type":"ListItem","position":2,"name":"Key dates","item":"https://australianculture.biblioverse.org/key-dates.html"}]}}]}</script>
<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Key dates","url":"https://australianculture.biblioverse.org/key-dates.html","numberOfItems":21,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"New Year and Federation","description":"(Public holidays · 1 January) The year opens with fireworks over the Harbour Bridge and the Opera House, watched around the world. It also marks Federation: on 1 January 1901 the six colonies united and the Commonwealth of Australia was born. First Nations view: The 1901 Constitution said Aboriginal people were not to be counted in the population. That clause only went in the 1967 referendum.","sameAs":"https://en.wikipedia.org/wiki/Federation_of_Australia"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Australia Day","description":"(Public holidays · 26 January) National public holiday marking the arrival of the First Fleet at Sydney Cove in 1788. Expect barbies, the beach, citizenship ceremonies and, the evening before, the Australian of the Year announcement. First Nations view: For many Aboriginal and Torres Strait Islander people it is Invasion Day or Survival Day, with marches around the country. The protest goes back a long way: 26 January 1938 was the Day of Mourning in Sydney. The push to change the date keeps growing, and in 2018 triple j moved its Hottest 100 off the day.","sameAs":"https://en.wikipedia.org/wiki/Australia_Day"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Anniversary of the Apology","description":"(First Nations dates · 13 February) On 13 February 2008 Prime Minister Kevin Rudd apologised in Parliament to the Stolen Generations: Aboriginal children taken from their families under government policy. The day is marked every year.","sameAs":"https://en.wikipedia.org/wiki/Apology_to_Australia%27s_Indigenous_peoples"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Sydney Mardi Gras","description":"(Culture and community · February or March) The LGBTQIA+ parade down Oxford Street, one of the biggest in the world. It began in 1978 as a protest, when dozens of marchers were arrested by police.","sameAs":"https://en.wikipedia.org/wiki/Sydney_Gay_and_Lesbian_Mardi_Gras"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Clean Up Australia Day","description":"(Culture and community · First Sunday in March) Volunteers across the country pick up rubbish from beaches, parks and rivers. It started in 1989 with sailor Ian Kiernan, appalled by the rubbish he saw at sea.","sameAs":"https://en.wikipedia.org/wiki/Clean_Up_Australia"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Labour Day","description":"(Public holidays · March, May or October) The workers’ holiday falls on different dates in each state. It celebrates the eight-hour day, won by Melbourne stonemasons in 1856, one of the first in the world.","sameAs":"https://en.wikipedia.org/wiki/Labour_Day"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Harmony Day","description":"(Culture and community · 21 March) A day celebrating cultural diversity, with schools and offices dressed in orange. It falls on the UN International Day for the Elimination of Racial Discrimination. First Nations view: Critics, including First Nations leaders, say the name “harmony” softens the day and takes the focus off fighting racism, which was the UN’s point.","sameAs":"https://en.wikipedia.org/wiki/Harmony_Day"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Easter","description":"(Public holidays · March or April) A long weekend from Good Friday to Easter Monday. Alongside the bunny there’s the chocolate bilby: rabbits are a pest here, and the bilby is a threatened native marsupial.","sameAs":"https://en.wikipedia.org/wiki/Easter"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Anzac Day","description":"(Remembrance · 25 April) The country’s most solemn day remembers the Gallipoli landing in 1915 and everyone who has served. It starts with dawn services and carries on with marches and two-up in the pubs. First Nations view: Aboriginal soldiers fought in the world wars and came home to be shut out of the land and benefits other veterans got. Many also want the Frontier Wars, fought between settlers and Aboriginal peoples, remembered like other wars.","sameAs":"https://en.wikipedia.org/wiki/Anzac_Day"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Mother’s Day","description":"(Culture and community · Second Sunday in May) Breakfast in bed and flowers. The traditional flower is the chrysanthemum: it blooms in May, and its nickname, mum, says it all.","sameAs":"https://en.wikipedia.org/wiki/Mother%27s_Day"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"National Sorry Day","description":"(First Nations dates · 26 May) A day to remember the Stolen Generations, held since 1998, a year after the Bringing Them Home report revealed the scale of the removals.","sameAs":"https://en.wikipedia.org/wiki/National_Sorry_Day"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"National Reconciliation Week","description":"(First Nations dates · 27 May to 3 June) A week for building relationships between all Australians and First Nations peoples. The dates mark two wins: the 1967 referendum (27 May) and the 1992 Mabo decision (3 June), which recognised native title.","sameAs":"https://en.wikipedia.org/wiki/National_Reconciliation_Week"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"King’s Birthday","description":"(Public holidays · Second Monday in June) A holiday for the monarch, in June in most states (Queensland and WA use other dates). It isn’t King Charles III’s actual birthday, which is in November. First Nations view: For many First Nations people the Crown is where colonisation began, and the day tends to bring up the debate about Australia becoming a republic.","sameAs":"https://en.wikipedia.org/wiki/King%27s_Official_Birthday"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"NAIDOC Week","description":"(First Nations dates · First week of July) The big celebration of the history, culture and achievements of Aboriginal and Torres Strait Islander peoples, with events all over the country. Its roots go back to the protests of 1938.","sameAs":"https://en.wikipedia.org/wiki/NAIDOC_Week"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Aboriginal and Torres Strait Islander Children’s Day","description":"(First Nations dates · 4 August) Celebrating First Nations children since 1988. The date was chosen because many Stolen Generations children never knew their birthday and celebrated on this day."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Father’s Day","description":"(Culture and community · First Sunday in September) Celebrated in spring, on the first Sunday in September, with breakfasts, barbies and the footy.","sameAs":"https://en.wikipedia.org/wiki/Father%27s_Day"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"R U OK? Day","description":"(Culture and community · Second Thursday in September) A day to ask family, friends and workmates: “Are you OK?” Started in 2009 to help prevent suicide and get people talking about mental health.","sameAs":"https://en.wikipedia.org/wiki/R_U_OK%3F"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"AFL Grand Final","description":"(Culture and community · Late September) The Aussie rules decider at the MCG in Melbourne. In Victoria, the Friday before the game is a public holiday.","sameAs":"https://en.wikipedia.org/wiki/AFL_Grand_Final"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Remembrance Day","description":"(Remembrance · 11 November) At 11 am the country stops for a minute’s silence, the hour the First World War ended in 1918. People wear red poppies on their lapels.","sameAs":"https://en.wikipedia.org/wiki/Remembrance_Day"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Christmas","description":"(Public holidays · 25 December) Christmas in summer: the beach, the pool, pavlova and Carols by Candlelight in Melbourne.","sameAs":"https://en.wikipedia.org/wiki/Christmas_in_Australia"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Boxing Day","description":"(Public holidays · 26 December) Sales day, the Boxing Day Test at the MCG and the start of the Sydney to Hobart yacht race, with the harbour full of boats.","sameAs":"https://en.wikipedia.org/wiki/Boxing_Day_Test"}}]}]}</script>
