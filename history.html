<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Moments in history","url":"https://australianculture.biblioverse.org/history.html","numberOfItems":30,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"The First Peoples","description":"(First Peoples · 65,000–50,000 BC) The ancestors of Aboriginal people arrive on the continent. The oldest continuous living culture on Earth begins, with hundreds of nations and languages."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"The Dutch","description":"(Colonisation · 1606) Willem Janszoon, aboard the Duyfken, is the first recorded European to set foot in Australia, on Cape York."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"James Cook","description":"(Colonisation · 1770) The British captain charts the east coast, lands at Botany Bay and claims the land for the Crown."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"The First Fleet","description":"(Colonisation · 26 Jan 1788) Eleven ships carrying about 1,400 people, half of them convicts, found the penal colony at Sydney Cove. The date is Australia Day, which many Indigenous people call Invasion Day."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"A convict colony","description":"(Colonisation · 1788–1868) Around 162,000 convicts are transported from Britain. The last ship arrives in Western Australia in 1868."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"The gold rush","description":"(Nation · 1851) Gold in NSW and Victoria sends the population soaring and makes Melbourne one of the richest cities in the world."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Eureka Stockade","description":"(Nation · 1854) Miners at Ballarat rebel against the colonial government. The uprising is seen as the birthplace of Australian democracy."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Ned Kelly","description":"(Nation · 1880) The outlaw in iron armour is hanged in Melbourne and becomes a national legend."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Federation","description":"(Nation · 1 Jan 1901) The six colonies unite to form the Commonwealth of Australia. The same year, the White Australia policy begins."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Votes for women","description":"(Nation · 1902) Women (but not Indigenous women) win the right to vote and stand in federal elections."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Gallipoli","description":"(War · 25 Apr 1915) ANZAC troops land in Turkey. The defeat becomes a founding myth; 25 April is Anzac Day."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Harbour Bridge","description":"(Nation · 1932) Sydney’s bridge opens. The same year, the Great Emu War takes place."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Darwin bombed","description":"(War · 1942) In World War II Japan attacks Darwin, the biggest foreign attack ever on Australian soil."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"“Populate or perish”","description":"(Society · 1945) Mass post-war migration begins, with British, Italian, Greek and other European arrivals. More than 7 million people would come in the following decades."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Melbourne Olympics","description":"(Society · 1956) The first Games in the southern hemisphere. Television arrives the same year."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"The dollar arrives","description":"(Society · 1966) Decimal currency replaces the Australian pound."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"A historic referendum","description":"(First Peoples · 1967) 90.77% vote for Aboriginal people to be counted in the Census and covered by federal laws."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"White Australia ends","description":"(Society · 1973) The Whitlam government finally abandons race-based immigration policy. The Opera House opens."}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"The Dismissal","description":"(Nation · 1975) The Governor-General sacks Prime Minister Gough Whitlam, the country’s biggest constitutional crisis."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"America’s Cup","description":"(Society · 1983) Australia II ends 132 years of American dominance in the race. PM Bob Hawke says any boss who sacks someone for not turning up to work that day “is a bum”."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Australia Act","description":"(Nation · 1986) The last legal ties with the British Parliament are cut."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"The Mabo decision","description":"(First Peoples · 1992) The High Court overturns the idea of “terra nullius” (nobody’s land) and recognises native title."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Port Arthur and guns","description":"(Society · 1996) After 35 people are killed in Tasmania, the country passes strict gun laws, with a buyback of 650,000 firearms."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"The republic referendum","description":"(Nation · 1999) Voters reject swapping the monarchy for a republic. The British monarch remains head of state."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Sydney Olympics","description":"(Society · 2000) Aboriginal athlete Cathy Freeman lights the cauldron and wins the 400 m."}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"The Apology","description":"(First Peoples · 2008) PM Kevin Rudd apologises to the Stolen Generations, Indigenous children taken from their families."}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Marriage equality","description":"(Society · 2017) After a postal survey returns 61.6% “yes”, same-sex marriage becomes law."}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Black Summer","description":"(Society · 2019–20) Bushfires burn more than 24 million hectares and kill or displace around 3 billion animals."}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"The Matildas and the Voice","description":"(First Peoples · 2023) The women’s team reaches the World Cup semi-final at home and stops the nation. In October, the referendum on an Indigenous Voice to Parliament is defeated."}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"Olympic Brisbane","description":"(Society · 2032) Brisbane will be the third Australian city to host the Olympic Games."}}]}]}</script>
