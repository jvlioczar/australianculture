<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Inventions","url":"https://australianculture.biblioverse.org/inventions.html","numberOfItems":25,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Boomerang","description":"(First Peoples · millennia) An aerodynamic hunting and fighting tool of Aboriginal peoples; some kinds come back to the thrower.","sameAs":"https://en.wikipedia.org/wiki/Boomerang"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Woomera","description":"(First Peoples · millennia) A spear-thrower that adds range and power to the throw.","sameAs":"https://en.wikipedia.org/wiki/Woomera_(spear-thrower)"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Didgeridoo","description":"(First Peoples · millennia) A wind instrument made from a trunk hollowed out by termites, from northern Australia.","sameAs":"https://en.wikipedia.org/wiki/Didgeridoo"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Mechanical refrigeration","description":"(Everyday life · 1856) James Harrison built one of the first ice-making machines in Geelong, paving the way for frozen exports.","sameAs":"https://en.wikipedia.org/wiki/James_Harrison_(engineer)"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"Secret ballot","description":"(Society · 1856) Created in Victoria and South Australia, the “Australian ballot” was copied all over the world.","sameAs":"https://en.wikipedia.org/wiki/Secret_ballot"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Aussie rules football","description":"(Society · 1858) Tom Wills helped write the rules to keep cricketers fit over winter. Today it’s the AFL.","sameAs":"https://en.wikipedia.org/wiki/Australian_rules_football"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Electric drill","description":"(Everyday life · 1889) Arthur James Arnot and William Blanch Brain built the first one in Melbourne, to bore through rock and coal.","sameAs":"https://en.wikipedia.org/wiki/Arthur_James_Arnot"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"First feature film","description":"(Society · 1906) The Story of the Kelly Gang, about the outlaw Ned Kelly, is considered the world’s first feature-length narrative film.","sameAs":"https://en.wikipedia.org/wiki/The_Story_of_the_Kelly_Gang"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Pacemaker","description":"(Health · 1926) Mark Lidwill and physicist Edgar Booth used a portable device to revive a baby in Sydney.","sameAs":"https://en.wikipedia.org/wiki/Pacemaker"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Penicillin at scale","description":"(Health · 1940s) Australian Howard Florey turned Fleming’s discovery into a medicine. A Nobel Prize in 1945 and millions of lives saved.","sameAs":"https://en.wikipedia.org/wiki/Howard_Florey"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Hills Hoist","description":"(Everyday life · 1945) The rotary clothesline found in every Aussie backyard. Lance Hill made it in Adelaide.","sameAs":"https://en.wikipedia.org/wiki/Hills_Hoist"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Black box","description":"(Technology · 1956) Melbourne’s David Warren invented the cockpit voice and flight data recorder, now required in every plane.","sameAs":"https://en.wikipedia.org/wiki/Flight_recorder"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Plastic spectacle lenses","description":"(Health · 1960) Developed in Adelaide by SOLA, around 60% lighter than glass.","sameAs":"https://en.wikipedia.org/wiki/Timeline_of_Australian_inventions"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Medical ultrasound","description":"(Health · 1960s) The government’s Ultrasonics Institute built pioneering imaging machines for pregnancy scans.","sameAs":"https://en.wikipedia.org/wiki/Medical_ultrasound"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"Inflatable escape slide","description":"(Technology · 1965) Qantas employee Jack Grant invented the inflatable evacuation slide that doubles as a raft.","sameAs":"https://en.wikipedia.org/wiki/Evacuation_slide"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"Cask wine","description":"(Everyday life · 1965) The “goon bag”: wine in a plastic bladder inside a box, invented by Tom Angove. A backpacker classic.","sameAs":"https://en.wikipedia.org/wiki/Box_wine"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Permaculture","description":"(Society · 1978) Bill Mollison and David Holmgren, from Tasmania, created the sustainable farming system now used worldwide.","sameAs":"https://en.wikipedia.org/wiki/Permaculture"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Cochlear implant","description":"(Health · 1978) Graeme Clark created the multi-channel “bionic ear” in Melbourne, restoring hearing to hundreds of thousands of people.","sameAs":"https://en.wikipedia.org/wiki/Cochlear_implant"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Dual-flush toilet","description":"(Everyday life · 1980) Bruce Thompson at Caroma came up with the half and full flush buttons to save water.","sameAs":"https://en.wikipedia.org/wiki/Dual_flush_toilet"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"CPAP","description":"(Health · 1981) Sydney’s Colin Sullivan invented the mask that treats sleep apnoea. It led to the company ResMed.","sameAs":"https://en.wikipedia.org/wiki/Continuous_positive_airway_pressure"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Polymer banknotes","description":"(Technology · 1988) The Reserve Bank and CSIRO created the first plastic notes: longer-lasting and hard to forge. Dozens of countries now use them.","sameAs":"https://en.wikipedia.org/wiki/Polymer_banknote"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Wi-Fi","description":"(Technology · 1992) A CSIRO team led by John O’Sullivan patented the technology that made Wi-Fi fast and reliable.","sameAs":"https://en.wikipedia.org/wiki/Wi-Fi"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Spray-on skin","description":"(Health · 1990s) Perth’s Fiona Wood developed a spray of the patient’s own cells to treat burns. Used on victims of the 2002 Bali bombings.","sameAs":"https://en.wikipedia.org/wiki/Fiona_Wood"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"HPV vaccine","description":"(Health · 2006) Ian Frazer and Chinese scientist Jian Zhou developed the technology in Brisbane for the vaccine that prevents cervical cancer.","sameAs":"https://en.wikipedia.org/wiki/HPV_vaccine"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Google Maps","description":"(Technology · 2005) Danish brothers Lars and Jens Rasmussen created it in Sydney at the startup Where 2, bought by Google in 2004.","sameAs":"https://en.wikipedia.org/wiki/Google_Maps"}}]}]}</script>
