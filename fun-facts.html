<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Fun facts","url":"https://australianculture.biblioverse.org/fun-facts.html","numberOfItems":25,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Official name and colours","description":"The official name is the Commonwealth of Australia. The national colours are green and gold, from the leaves and blossom of the golden wattle, proclaimed in 1984 and worn by the national sporting teams."}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"An anthem without God or guns","description":"Advance Australia Fair has no military or religious references. The 1879 original was more imperial: one verse praised Captain Cook and ended with “Britannia rules the wave”, and another called on Australians to rouse to arms. Those verses were dropped when it became the official anthem in 1984. In 2021, “young and free” became “one and free”, recognising First Nations peoples."}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"More roos than people","description":"There are more than 40 million kangaroos and about 28 million people."}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Everyone’s on the coast","description":"Around 85% of people live within 50 km of the coast. The interior is practically empty."}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"A dry country","description":"Around 70% of the land is arid or semi-arid. It’s the driest inhabited continent on the planet."}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Wider than the Moon","description":"From east to west Australia is about 4,000 km across. The Moon is 3,474 km in diameter."}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"The continent is moving","description":"The Australian plate moves about 7 cm north every year. In 2017 the country shifted its GPS coordinates by 1.8 m."}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"A capital by compromise","description":"Sydney and Melbourne both wanted to be the capital, so Canberra was built in between, on purpose."}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Christmas in summer","description":"Santa in boardshorts, Christmas lunch at the beach and the Boxing Day Test (26 December)."}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Thongs are flip-flops","description":"If an Aussie says they forgot their thongs, they’re talking about their footwear."}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Everything gets shortened","description":"Brekkie (breakfast), arvo (afternoon), servo (service station), avo (avocado), sunnies (sunglasses), Chrissie (Christmas)."}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"No official language","description":"English is the main language, but no law makes it official. Before colonisation there were more than 250 Indigenous languages."}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"A third born overseas","description":"About 32% of the population was born in another country. Almost half have at least one parent born overseas."}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Cube-shaped poo","description":"The wombat is the only animal known to make cube-shaped poo."}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"The platypus","description":"A mammal that lays eggs, has a duck’s bill and the males have a venomous spur. European scientists thought it was a hoax."}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"A coat of arms that doesn’t go backwards","description":"The kangaroo and emu are on the coat of arms, and tradition says it’s because they rarely move backwards, only forwards."}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Slip, Slop, Slap","description":"The country has one of the highest skin cancer rates in the world. At school the rule is “No hat, no play”."}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Driving on the left","description":"A British legacy. Pedestrians, look right first!"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"No tipping required","description":"Wages are high, so nobody expects a tip, though it’s appreciated at restaurants."}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"The cleanest air","description":"The Cape Grim station in Tasmania measures some of the purest air on the planet."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"The PM who vanished","description":"Prime Minister Harold Holt disappeared while swimming in 1967. A swimming pool was later named after him."}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Koalas sleep 20 hours","description":"A diet of gum leaves gives very little energy, so koalas sleep most of the day."}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Over 10,000 beaches","description":"There are 10,685 beaches. Visiting one a day would take almost 30 years."}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Biosecurity is serious","description":"Forgetting to declare a piece of fruit or some seeds on arrival can cost you thousands of dollars."}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Shifting time zones","description":"There are three main time zones, but because QLD, WA and the NT don’t do daylight saving, in summer the country runs on five different times."}}]}]}</script>
