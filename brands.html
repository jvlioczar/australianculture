<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Companies and brands","url":"https://australianculture.biblioverse.org/brands.html","numberOfItems":30,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","name":"Qantas","description":"(Transport · 1920) Born in Queensland as Queensland and Northern Territory Aerial Services. One of the oldest airlines still flying, with the kangaroo on its tail.","sameAs":"https://en.wikipedia.org/wiki/Qantas"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","name":"Canva","description":"(Tech · 2013) Founded by Perth’s Melanie Perkins and based in Sydney. A design tool used in just about every country.","sameAs":"https://en.wikipedia.org/wiki/Canva"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","name":"Atlassian","description":"(Tech · 2002) Sydney company behind Jira, Confluence and Trello. Started on a A$10,000 credit card.","sameAs":"https://en.wikipedia.org/wiki/Atlassian"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","name":"Afterpay","description":"(Tech · 2014) Took “buy now, pay later” global. Sold in 2022 to Block (the Square company) for about US$29 billion.","sameAs":"https://en.wikipedia.org/wiki/Afterpay"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","name":"BHP","description":"(Mining and energy · 1885) Started at the Broken Hill silver mine (NSW) and became the biggest mining company in the world. “The Big Australian”.","sameAs":"https://en.wikipedia.org/wiki/BHP"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","name":"Rio Tinto","description":"(Mining and energy · 1873) Anglo-Australian iron ore giant, with its big mines in the Pilbara (WA).","sameAs":"https://en.wikipedia.org/wiki/Rio_Tinto_(corporation)"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","name":"Commonwealth Bank","description":"(Banks · 1911) The country’s biggest bank, one of the “Big Four” with Westpac, NAB and ANZ. The yellow and black diamond is on every corner.","sameAs":"https://en.wikipedia.org/wiki/Commonwealth_Bank"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","name":"Woolworths","description":"(Retail · 1924) The biggest supermarket chain (“Woolies”), no relation to the American Woolworth. Shares the market with Coles.","sameAs":"https://en.wikipedia.org/wiki/Woolworths_(Australia)"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","name":"Coles","description":"(Retail · 1914) The other half of the supermarket duopoly. Started in Collingwood, Melbourne.","sameAs":"https://en.wikipedia.org/wiki/Coles_Group"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","name":"Bunnings","description":"(Retail · 1886) Hardware and garden giant, famous for the weekend sausage sizzle out the front. A Sunday outing for plenty of families.","sameAs":"https://en.wikipedia.org/wiki/Bunnings"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","name":"Telstra","description":"(Telco · 1975) The biggest phone and internet provider, formerly government-owned. The one that gets reception in the outback.","sameAs":"https://en.wikipedia.org/wiki/Telstra"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","name":"Billabong","description":"(Fashion and surf · 1973) From the Gold Coast to the world: one of the surfwear brands that defined beachwear in the 80s and 90s.","sameAs":"https://en.wikipedia.org/wiki/Billabong_(clothing)"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","name":"Rip Curl","description":"(Fashion and surf · 1969) Born in Torquay, gateway to the Great Ocean Road, making surfboards and wetsuits.","sameAs":"https://en.wikipedia.org/wiki/Rip_Curl"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","name":"Quiksilver","description":"(Fashion and surf · 1969) Also from Torquay, it started with boardshorts. The logo is inspired by Hokusai’s wave.","sameAs":"https://en.wikipedia.org/wiki/Quiksilver"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","name":"UGG","description":"(Fashion and surf · 1970s) The sheepskin boots surfers wore to warm up. In Australia “ugg” is a generic word; the global UGG brand is American.","sameAs":"https://en.wikipedia.org/wiki/Ugg_boots"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","name":"R.M. Williams","description":"(Fashion and surf · 1932) Handmade leather boots from Adelaide, an icon of the bushman look and a favourite of politicians and King Charles.","sameAs":"https://en.wikipedia.org/wiki/R._M._Williams"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","name":"Akubra","description":"(Fashion and surf · 1912) The wide-brimmed felt hat of the outback. Crocodile Dundee wore one.","sameAs":"https://en.wikipedia.org/wiki/Akubra"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","name":"Blundstone","description":"(Fashion and surf · 1870) Tasmania’s Chelsea boots. From building sites to catwalks.","sameAs":"https://en.wikipedia.org/wiki/Blundstone_Footwear"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","name":"Cotton On","description":"(Fashion and surf · 1991) Affordable fashion chain from Geelong, now in more than 15 countries.","sameAs":"https://en.wikipedia.org/wiki/Cotton_On_Group"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","name":"Zimmermann","description":"(Fashion and surf · 1991) Sisters Nicky and Simone Zimmermann took Sydney’s romantic style to Paris Fashion Week."}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","name":"Aesop","description":"(Beauty · 1987) Minimalist skincare from Melbourne, with award-winning store design. Bought by L’Oréal in 2023.","sameAs":"https://en.wikipedia.org/wiki/Aesop_(brand)"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","name":"Arnott’s","description":"(Food · 1865) The biscuit maker behind Tim Tams, Shapes and Iced VoVos, with the parrot on the logo.","sameAs":"https://en.wikipedia.org/wiki/Arnott%27s_Group"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","name":"Bundaberg","description":"(Food · 1960) Queensland’s ginger beer. The town also gives its name to the famous “Bundy” rum.","sameAs":"https://en.wikipedia.org/wiki/Bundaberg_Brewed_Drinks"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","name":"Penfolds","description":"(Food · 1844) Adelaide winery. Its Grange is the country’s most iconic (and expensive) wine.","sameAs":"https://en.wikipedia.org/wiki/Penfolds"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","name":"Holden","description":"(Transport · 1856) Started out making saddles and became the “national” car maker (owned by GM). The Commodore and the ute reigned until the brand closed in 2020.","sameAs":"https://en.wikipedia.org/wiki/Holden"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","name":"Guzman y Gomez","description":"(Food · 2006) Sydney Mexican chain that became a craze and listed on the stock exchange in 2024.","sameAs":"https://en.wikipedia.org/wiki/Guzman_y_Gomez"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","name":"Boost Juice","description":"(Food · 2000) Adelaide smoothie chain, now in more than 10 countries.","sameAs":"https://en.wikipedia.org/wiki/Boost_Juice"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","name":"Westfield","description":"(Retail · 1959) Westfield shopping centres started in Sydney (Blacktown) and spread to the US and Europe.","sameAs":"https://en.wikipedia.org/wiki/Westfield_Corporation"}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","name":"Cochlear","description":"(Tech · 1981) World leader in hearing implants, born from Graeme Clark’s invention.","sameAs":"https://en.wikipedia.org/wiki/Cochlear_Limited"}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","name":"CSL","description":"(Tech · 1916) Started as a government lab and grew into one of the biggest biotech companies in the world.","sameAs":"https://en.wikipedia.org/wiki/CSL_Limited"}}]}]}</script>
