<script type="application/ld+json" id="ld-content">{"@context":"https://schema.org","@graph":[{"@type":"ItemList","name":"Places","url":"https://australianculture.biblioverse.org/places.html","numberOfItems":58,"itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"TouristAttraction","name":"Bondi Beach","description":"The country’s most famous beach, 7 km from the Sydney CBD. Home to the Icebergs ocean pool, the lifeguards of Bondi Rescue and the 6 km coastal walk to Coogee.","sameAs":"https://en.wikipedia.org/wiki/Bondi_Beach"}},{"@type":"ListItem","position":2,"item":{"@type":"TouristAttraction","name":"Whitehaven Beach","description":"Seven kilometres of almost pure silica sand in the Whitsundays. From the Hill Inlet lookout, the tide swirls white sand through turquoise water.","sameAs":"https://en.wikipedia.org/wiki/Whitehaven_Beach"}},{"@type":"ListItem","position":3,"item":{"@type":"TouristAttraction","name":"Manly Beach","description":"Half an hour by ferry from Circular Quay, past the Opera House. A surf beach with the Corso promenade and a proper beach-town feel.","sameAs":"https://en.wikipedia.org/wiki/Manly_Beach"}},{"@type":"ListItem","position":4,"item":{"@type":"TouristAttraction","name":"Bells Beach","description":"A legendary break near Torquay, at the start of the Great Ocean Road. Every Easter it hosts the Rip Curl Pro, one of the world’s most storied surf contests.","sameAs":"https://en.wikipedia.org/wiki/Bells_Beach"}},{"@type":"ListItem","position":5,"item":{"@type":"TouristAttraction","name":"Byron Bay","description":"Surf town with an alternative streak. The Cape Byron lighthouse marks the most easterly point of mainland Australia.","sameAs":"https://en.wikipedia.org/wiki/Byron_Bay"}},{"@type":"ListItem","position":6,"item":{"@type":"TouristAttraction","name":"Cable Beach","description":"22 km of white sand at Broome in the north-west. Sunset over the Indian Ocean is the main event of the day.","sameAs":"https://en.wikipedia.org/wiki/Cable_Beach"}},{"@type":"ListItem","position":7,"item":{"@type":"TouristAttraction","name":"Cottesloe Beach","description":"Perth’s beach, with calm water and sunsets over the sea. Every year it hosts the open-air Sculpture by the Sea exhibition.","sameAs":"https://en.wikipedia.org/wiki/Cottesloe_Beach"}},{"@type":"ListItem","position":8,"item":{"@type":"TouristAttraction","name":"Hyams Beach","description":"On Jervis Bay, south of Sydney, it’s famous for its dazzling white sand and crystal-clear water.","sameAs":"https://en.wikipedia.org/wiki/Hyams_Beach"}},{"@type":"ListItem","position":9,"item":{"@type":"TouristAttraction","name":"Wineglass Bay","description":"The wineglass-shaped bay in Freycinet National Park. The track up to the lookout is one of Tasmania’s most photographed walks.","sameAs":"https://en.wikipedia.org/wiki/Freycinet_National_Park"}},{"@type":"ListItem","position":10,"item":{"@type":"TouristAttraction","name":"Surfers Paradise","description":"The heart of the Gold Coast: high-rises right on the sand, waves all year and a lively nightlife.","sameAs":"https://en.wikipedia.org/wiki/Surfers_Paradise"}},{"@type":"ListItem","position":11,"item":{"@type":"TouristAttraction","name":"Rottnest Island","description":"Wadjemup to the Noongar people. A car-free island 18 km off Fremantle, explored by bike between bays of crystal-clear water. Home of the quokkas, famous for selfies where they seem to smile.","sameAs":"https://en.wikipedia.org/wiki/Rottnest_Island"}},{"@type":"ListItem","position":12,"item":{"@type":"TouristAttraction","name":"Uluṟu-Kata Tjuṯa","description":"Country of the Anangu, the Traditional Owners. Uluru stands 348 m high and climbing it has been banned since 2019 out of respect; nearby, Kata Tjuta is a cluster of 36 rock domes.","sameAs":"https://en.wikipedia.org/wiki/Ulu%E1%B9%9Fu-Kata_Tju%E1%B9%AFa_National_Park"}},{"@type":"ListItem","position":13,"item":{"@type":"TouristAttraction","name":"Kakadu","description":"The country’s second-biggest national park (after Munga-Thirri–Simpson Desert), World Heritage-listed for both nature and culture. Ubirr and Burrungkuy hold Aboriginal rock art thousands of years old.","sameAs":"https://en.wikipedia.org/wiki/Kakadu_National_Park"}},{"@type":"ListItem","position":14,"item":{"@type":"TouristAttraction","name":"Blue Mountains","description":"Two hours from Sydney, with the Three Sisters rock formation and the blue haze rising off the gum trees. World Heritage-listed since 2000.","sameAs":"https://en.wikipedia.org/wiki/Blue_Mountains_(New_South_Wales)"}},{"@type":"ListItem","position":15,"item":{"@type":"TouristAttraction","name":"Daintree Rainforest","description":"One of the oldest rainforests on Earth. At Cape Tribulation, the forest runs right down to the sea and the Great Barrier Reef.","sameAs":"https://en.wikipedia.org/wiki/Daintree_Rainforest"}},{"@type":"ListItem","position":16,"item":{"@type":"TouristAttraction","name":"Royal National Park","description":"Created in 1879, it’s the world’s second-oldest national park after Yellowstone. On Sydney’s southern edge, with clifftop walks and rock pools.","sameAs":"https://en.wikipedia.org/wiki/Royal_National_Park"}},{"@type":"ListItem","position":17,"item":{"@type":"TouristAttraction","name":"Cradle Mountain","description":"Jagged peaks above Dove Lake. It’s the start of the Overland Track, a 65 km hike through Tasmania’s wilderness.","sameAs":"https://en.wikipedia.org/wiki/Cradle_Mountain-Lake_St_Clair_National_Park"}},{"@type":"ListItem","position":18,"item":{"@type":"TouristAttraction","name":"Gariwerd (Grampians)","description":"Sandstone ranges in western Victoria, with lookouts like the Pinnacle and the Balconies and many Aboriginal rock art sites.","sameAs":"https://en.wikipedia.org/wiki/Grampians_National_Park"}},{"@type":"ListItem","position":19,"item":{"@type":"TouristAttraction","name":"Karijini","description":"Deep red gorges in the Pilbara, with natural pools and waterfalls tucked between rock walls billions of years old.","sameAs":"https://en.wikipedia.org/wiki/Karijini_National_Park"}},{"@type":"ListItem","position":20,"item":{"@type":"TouristAttraction","name":"Kings Park","description":"One of the biggest inner-city parks in the world, larger than New York’s Central Park, looking over the Perth CBD and the Swan River.","sameAs":"https://en.wikipedia.org/wiki/Kings_Park,_Western_Australia"}},{"@type":"ListItem","position":21,"item":{"@type":"TouristAttraction","name":"Royal Botanic Garden Sydney","description":"Opened in 1816 next to the Opera House. From Mrs Macquarie’s Chair you get the bridge and the Opera House in one shot.","sameAs":"https://en.wikipedia.org/wiki/Royal_Botanic_Garden,_Sydney"}},{"@type":"ListItem","position":22,"item":{"@type":"TouristAttraction","name":"South Bank and Streets Beach","description":"Riverside parklands on the old Expo 88 site in Brisbane, home to Streets Beach: a man-made beach with sand and a lagoon right in the city, free and patrolled by lifeguards. Across the river sits Queen’s Wharf, the precinct with The Star casino, hotels and restaurants.","sameAs":"https://en.wikipedia.org/wiki/South_Bank_Parklands"}},{"@type":"ListItem","position":23,"item":{"@type":"TouristAttraction","name":"Great Barrier Reef","description":"The world’s largest coral reef system, around 2,300 km long. World Heritage-listed since 1981 and visible from space.","sameAs":"https://en.wikipedia.org/wiki/Great_Barrier_Reef"}},{"@type":"ListItem","position":24,"item":{"@type":"TouristAttraction","name":"Twelve Apostles","description":"Limestone stacks rising out of the sea along the Great Ocean Road. Despite the name, only seven are still standing: erosion knocks them down one by one.","sameAs":"https://en.wikipedia.org/wiki/The_Twelve_Apostles_(Victoria)"}},{"@type":"ListItem","position":25,"item":{"@type":"TouristAttraction","name":"K’gari","description":"The world’s largest sand island, formerly Fraser Island. In 2023 it officially went back to its Butchulla name, which means “paradise”.","sameAs":"https://en.wikipedia.org/wiki/K%27gari"}},{"@type":"ListItem","position":26,"item":{"@type":"TouristAttraction","name":"The Pinnacles","description":"Thousands of limestone pillars scattered across the yellow sand of Nambung National Park, north of Perth. It looks like another planet.","sameAs":"https://en.wikipedia.org/wiki/The_Pinnacles_(Western_Australia)"}},{"@type":"ListItem","position":27,"item":{"@type":"TouristAttraction","name":"Lake Hillier","description":"A bubblegum-pink lake on Middle Island in the Recherche Archipelago. The colour comes from algae and bacteria living in the salty water.","sameAs":"https://en.wikipedia.org/wiki/Lake_Hillier"}},{"@type":"ListItem","position":28,"item":{"@type":"TouristAttraction","name":"Wave Rock","description":"A 15-metre granite wall shaped like a wave about to break, near the small town of Hyden.","sameAs":"https://en.wikipedia.org/wiki/Wave_Rock"}},{"@type":"ListItem","position":29,"item":{"@type":"TouristAttraction","name":"Purnululu (Bungle Bungle)","description":"Beehive-shaped sandstone domes striped orange and black, in the Kimberley. The wider world only learned of them in the 1980s; they’re now World Heritage-listed.","sameAs":"https://en.wikipedia.org/wiki/Purnululu_National_Park"}},{"@type":"ListItem","position":30,"item":{"@type":"TouristAttraction","name":"Ikara (Wilpena Pound)","description":"A vast natural amphitheatre of mountains in the Flinders Ranges, a sacred place for the Adnyamathanha people.","sameAs":"https://en.wikipedia.org/wiki/Wilpena_Pound"}},{"@type":"ListItem","position":31,"item":{"@type":"TouristAttraction","name":"Whitsunday Islands","description":"Seventy-four islands in the middle of the Great Barrier Reef, made for sailing, snorkelling and Whitehaven Beach.","sameAs":"https://en.wikipedia.org/wiki/Whitsunday_Islands"}},{"@type":"ListItem","position":32,"item":{"@type":"TouristAttraction","name":"Sydney Opera House","description":"Opened in 1973, with sails designed by Danish architect Jørn Utzon. World Heritage-listed since 2007 and the symbol of the nation.","sameAs":"https://en.wikipedia.org/wiki/Sydney_Opera_House"}},{"@type":"ListItem","position":33,"item":{"@type":"TouristAttraction","name":"Parliament House","description":"Canberra’s parliament, opened in 1988, is built into a hill with a grassed roof you can walk over. On top sits an 81-metre flagpole.","sameAs":"https://en.wikipedia.org/wiki/Parliament_House,_Canberra"}},{"@type":"ListItem","position":34,"item":{"@type":"TouristAttraction","name":"Flinders Street Station","description":"The yellow 1910 station is Melbourne’s postcard. “Meet you under the clocks” is the city’s classic meeting spot.","sameAs":"https://en.wikipedia.org/wiki/Flinders_Street_railway_station"}},{"@type":"ListItem","position":35,"item":{"@type":"TouristAttraction","name":"Royal Exhibition Building","description":"An 1880 exhibition palace in Melbourne, where the first federal parliament sat in 1901. World Heritage-listed since 2004.","sameAs":"https://en.wikipedia.org/wiki/Royal_Exhibition_Building"}},{"@type":"ListItem","position":36,"item":{"@type":"TouristAttraction","name":"Queen Victoria Building","description":"An 1898 shopping arcade in the Sydney CBD, with domes, stained glass and mechanical clocks. It was nearly demolished in the 1950s.","sameAs":"https://en.wikipedia.org/wiki/Queen_Victoria_Building"}},{"@type":"ListItem","position":37,"item":{"@type":"TouristAttraction","name":"Federation Square","description":"A 2002 cultural square opposite Flinders Street, with geometric facades, galleries and a big screen for major events.","sameAs":"https://en.wikipedia.org/wiki/Federation_Square"}},{"@type":"ListItem","position":38,"item":{"@type":"TouristAttraction","name":"Sydney Tower Eye","description":"At 309 metres, the tallest structure in Sydney since 1981. From the deck you can see from the ocean to the Blue Mountains.","sameAs":"https://en.wikipedia.org/wiki/Sydney_Tower"}},{"@type":"ListItem","position":39,"item":{"@type":"TouristAttraction","name":"Q1","description":"A 322-metre residential tower in Surfers Paradise, with the SkyPoint observation deck up top and views of the whole Gold Coast.","sameAs":"https://en.wikipedia.org/wiki/Q1_(building)"}},{"@type":"ListItem","position":40,"item":{"@type":"TouristAttraction","name":"MONA","description":"Hobart’s Museum of Old and New Art, opened in 2011 and dug into the rock beside the Derwent River. Deliberately provocative.","sameAs":"https://en.wikipedia.org/wiki/Museum_of_Old_and_New_Art"}},{"@type":"ListItem","position":41,"item":{"@type":"TouristAttraction","name":"Sydney Harbour Bridge","description":"The “Coathanger”, opened in 1932, is one of the world’s largest steel arch bridges. You can walk over the arch on the BridgeClimb, 134 m above the water, and it’s the centrepiece of the New Year’s Eve fireworks.","sameAs":"https://en.wikipedia.org/wiki/Sydney_Harbour_Bridge"}},{"@type":"ListItem","position":42,"item":{"@type":"TouristAttraction","name":"Story Bridge","description":"A 1940 steel bridge over the Brisbane River and the city’s postcard. It has a guided climb too.","sameAs":"https://en.wikipedia.org/wiki/Story_Bridge"}},{"@type":"ListItem","position":43,"item":{"@type":"TouristAttraction","name":"West Gate Bridge","description":"The bridge over the Yarra in Melbourne. During construction in 1970 a span collapsed, killing 35 workers: Australia’s worst industrial accident.","sameAs":"https://en.wikipedia.org/wiki/West_Gate_Bridge"}},{"@type":"ListItem","position":44,"item":{"@type":"TouristAttraction","name":"Anzac Bridge","description":"A 1995 cable-stayed bridge in Sydney, with statues of an Australian and a New Zealand soldier honouring the Anzacs.","sameAs":"https://en.wikipedia.org/wiki/Anzac_Bridge"}},{"@type":"ListItem","position":45,"item":{"@type":"TouristAttraction","name":"Sea Cliff Bridge","description":"A bridge that curves around the cliff out over the ocean, on the Grand Pacific Drive near Wollongong. Straight out of a car ad.","sameAs":"https://en.wikipedia.org/wiki/Sea_Cliff_Bridge"}},{"@type":"ListItem","position":46,"item":{"@type":"TouristAttraction","name":"Richmond Bridge","description":"Built by convicts in 1823, it’s the oldest stone bridge still in use in Australia.","sameAs":"https://en.wikipedia.org/wiki/Richmond_Bridge_(Tasmania)"}},{"@type":"ListItem","position":47,"item":{"@type":"TouristAttraction","name":"Kurilpa Bridge","description":"A 2009 footbridge in Brisbane with masts and cables at wild angles. It’s the world’s largest tensegrity bridge.","sameAs":"https://en.wikipedia.org/wiki/Kurilpa_Bridge"}},{"@type":"ListItem","position":48,"item":{"@type":"TouristAttraction","name":"Tasman Bridge","description":"It links the two sides of Hobart. In 1975 a ship hit its pylons and brought down part of the bridge, splitting the city for nearly two years.","sameAs":"https://en.wikipedia.org/wiki/Tasman_Bridge"}},{"@type":"ListItem","position":49,"item":{"@type":"TouristAttraction","name":"Australian War Memorial","description":"Canberra’s memorial and museum, opened in 1941. Every afternoon the Last Post Ceremony tells the story of one name on the Roll of Honour.","sameAs":"https://en.wikipedia.org/wiki/Australian_War_Memorial"}},{"@type":"ListItem","position":50,"item":{"@type":"TouristAttraction","name":"Shrine of Remembrance","description":"Melbourne’s 1934 war memorial. At 11 am on 11 November, a ray of sunlight falls through the roof onto the word “Love” on the Stone of Remembrance.","sameAs":"https://en.wikipedia.org/wiki/Shrine_of_Remembrance"}},{"@type":"ListItem","position":51,"item":{"@type":"TouristAttraction","name":"Great Ocean Road","description":"243 km of coastal road built by soldiers returned from the First World War. It’s the largest war memorial in the world.","sameAs":"https://en.wikipedia.org/wiki/Great_Ocean_Road"}},{"@type":"ListItem","position":52,"item":{"@type":"TouristAttraction","name":"Aboriginal Tent Embassy","description":"Set up in 1972 outside Old Parliament House to demand land rights. It’s one of the longest-running protest sites in the world.","sameAs":"https://en.wikipedia.org/wiki/Aboriginal_Tent_Embassy"}},{"@type":"ListItem","position":53,"item":{"@type":"TouristAttraction","name":"Port Arthur","description":"A former convict settlement from 1830, now a historic site. Part of the World Heritage-listed Australian Convict Sites.","sameAs":"https://en.wikipedia.org/wiki/Port_Arthur,_Tasmania"}},{"@type":"ListItem","position":54,"item":{"@type":"TouristAttraction","name":"Fremantle Prison","description":"A prison built by convicts in the 1850s and used until 1991. Also part of the World Heritage-listed Australian Convict Sites.","sameAs":"https://en.wikipedia.org/wiki/Fremantle_Prison"}},{"@type":"ListItem","position":55,"item":{"@type":"TouristAttraction","name":"Old Parliament House","description":"Home of federal parliament from 1927 to 1988, in Canberra. It now houses the Museum of Australian Democracy.","sameAs":"https://en.wikipedia.org/wiki/Old_Parliament_House,_Canberra"}},{"@type":"ListItem","position":56,"item":{"@type":"TouristAttraction","name":"Big Banana","description":"Coffs Harbour’s giant banana, from 1964, kicked off the Big Things craze: there are now more than 150 oversized roadside sculptures around the country.","sameAs":"https://en.wikipedia.org/wiki/Big_Banana"}},{"@type":"ListItem","position":57,"item":{"@type":"TouristAttraction","name":"Big Pineapple","description":"A 16-metre pineapple on the Sunshine Coast, opened in 1971. Prince Charles and Princess Diana even dropped by.","sameAs":"https://en.wikipedia.org/wiki/Big_Pineapple"}},{"@type":"ListItem","position":58,"item":{"@type":"TouristAttraction","name":"Golden Guitar","description":"A 12-metre golden guitar in Tamworth, the home of Australian country music, where the Tamworth Country Music Festival runs every January.","sameAs":"https://en.wikipedia.org/wiki/Big_Golden_Guitar"}}]}]}</script>
